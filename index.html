<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="The Vault">
    <link rel="apple-touch-icon" href="https://api.iconify.design/ph:vault-fill.svg?color=%2378a9ff">
    
    <title>The Vault</title>
    <style>
        :root {
            --glass: rgba(0, 0, 0, 0.7);
            --border: rgba(120, 169, 255, 0.4);
            --glow: #78a9ff;
            --accent: #ffcc00; 
            --sidebar-width: 70px;
            --sidebar-expanded: 220px;
            --main-max-width: 1100px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        /* Prevent rubber-banding and accidental zooming */
        html, body { 
            height: 100%; 
            overflow: hidden; 
            position: fixed; 
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            margin: 0; padding: 0; display: flex;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #050a15; 
            background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2022&auto=format&fit=crop'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff;
        }

        @keyframes fadeInSmooth { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }

        /* --- SIDEBAR --- */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width);
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(30px);
            border-right: 1px solid var(--border); transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; z-index: 4000; display: flex; flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .sidebar:hover { width: var(--sidebar-expanded); }
        .sidebar-header { width: var(--sidebar-width); height: 70px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding-top: env(safe-area-inset-top); }
        .nav-icon { width: 24px; height: 18px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .nav-icon span { display: block; width: 100%; height: 2px; background: var(--glow); border-radius: 2px; transition: all 0.3s ease; box-shadow: 0 0 8px var(--glow); }

        .sidebar-btn {
            width: 100%; display: flex; align-items: center; background: transparent; border: none; 
            color: rgba(255, 255, 255, 0.5); padding: 18px 0; cursor: pointer; transition: 0.3s; 
            font-weight: 600; font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px; 
            white-space: nowrap; position: relative;
        }
        .sidebar-btn .icon-box { width: var(--sidebar-width); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .icon-svg { width: 22px; height: 22px; background-color: currentColor; mask-size: contain; mask-repeat: no-repeat; mask-position: center; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; transition: 0.3s; }
        
        .icon-all { -webkit-mask-image: url('https://api.iconify.design/ph:stack-simple.svg'); }
        .icon-watch { -webkit-mask-image: url('https://api.iconify.design/ph:clock-countdown.svg'); }
        .icon-pulse { -webkit-mask-image: url('https://api.iconify.design/ph:activity-bold.svg'); }
        .icon-done { -webkit-mask-image: url('https://api.iconify.design/ph:check-circle.svg'); }
        .icon-movie { -webkit-mask-image: url('https://api.iconify.design/ph:film-strip.svg'); }
        .icon-tv { -webkit-mask-image: url('https://api.iconify.design/ph:television.svg'); }
        .icon-animated { -webkit-mask-image: url('https://api.iconify.design/ph:rocket-launch.svg'); }
        .icon-anime { -webkit-mask-image: url('https://api.iconify.design/ph:ghost.svg'); }
        .icon-dice { -webkit-mask-image: url('https://api.iconify.design/ph:dice-five.svg'); }
        .icon-export { -webkit-mask-image: url('https://api.iconify.design/ph:export.svg'); }
        .icon-import { -webkit-mask-image: url('https://api.iconify.design/ph:import.svg'); }
        .icon-key { -webkit-mask-image: url('https://api.iconify.design/ph:key.svg'); }
        .icon-user { -webkit-mask-image: url('https://api.iconify.design/ph:user-circle.svg'); }

        .sidebar-btn span.label { opacity: 0; transition: opacity 0.2s; visibility: hidden; }
        .sidebar:hover .sidebar-btn span.label { opacity: 1; visibility: visible; }
        .sidebar-btn:hover, .sidebar-btn.active { color: var(--glow) !important; background: rgba(120, 169, 255, 0.1); }

        /* --- USER HUB --- */
        .user-hub {
            position: fixed; top: env(safe-area-inset-top); right: 20px; width: 60px; height: 60px;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; z-index: 5000; display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .user-hub:hover { width: 220px; border-radius: 20px; height: auto; padding-bottom: 15px; }
        .user-header { height: 60px; width: 100%; display: flex; align-items: center; padding-left: 17px; flex-shrink: 0; cursor: pointer; }
        .current-user-name { margin-left: 15px; font-weight: bold; color: var(--glow); text-transform: uppercase; letter-spacing: 1px; font-size: 0.8em; opacity: 0; transition: 0.2s; white-space: nowrap; }
        .user-hub:hover .current-user-name { opacity: 1; }
        .user-list { padding: 0 10px; display: flex; flex-direction: column; gap: 5px; }
        .user-item { padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 0.75em; text-transform: uppercase; color: rgba(255,255,255,0.5); display: flex; justify-content: space-between; }
        .user-item.active { color: var(--glow); border-left: 2px solid var(--glow); background: rgba(120, 169, 255, 0.05); }

        /* --- MAIN WRAPPER --- */
        .main-wrapper { 
            margin-left: var(--sidebar-width); width: 100%; 
            padding: calc(20px + env(safe-area-inset-top)) 20px 40px 20px; 
            display: flex; flex-direction: column; align-items: center; 
            overflow-y: auto; -webkit-overflow-scrolling: touch; 
        }
        .command-deck, .container { width: 100%; max-width: var(--main-max-width); background: var(--glass); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 24px; animation: fadeInSmooth 1s forwards; }
        .command-deck { padding: 20px; margin-bottom: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 15px; }
        .container { padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); min-height: 400px; }
        h1 { text-align: center; letter-spacing: 4px; text-shadow: 0 0 20px var(--glow); text-transform: uppercase; font-weight: 300; font-size: 1.4em; }
        
        .input-group { display: flex; gap: 8px; width: 100%; position: relative; }
        input[type="text"] { flex: 1; background: rgba(0, 0, 0, 0.7); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 12px; outline: none; font-size: 16px !important; }
        button#add-btn { background: var(--glow); color: #05162d; border: none; padding: 0 20px; cursor: pointer; font-weight: 700; border-radius: 12px; }

        #autocomplete-list { position: absolute; top: 55px; left: 0; right: 0; background: rgba(5, 10, 25, 0.98); border: 1px solid var(--border); border-radius: 12px; z-index: 5000; max-height: 250px; overflow-y: auto; padding: 0; list-style: none; display: none; }

        ul#showList { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        #showList li { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); padding: 10px; border-radius: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; animation: fadeInSmooth 0.4s ease-out; }

        .poster-container { width: 100%; aspect-ratio: 2/3; cursor: pointer; overflow: hidden; border-radius: 10px; position: relative; }
        .poster { width: 100%; height: 100%; object-fit: cover; background: #111; }
        
        .info { width: 100%; text-align: center; cursor: pointer; }
        .info strong { font-size: 0.9em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em; }

        .progress-container { width: 100%; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--glow); box-shadow: 0 0 8px var(--glow); }

        .controls { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; justify-content: center; }
        .state-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: rgba(255,255,255,0.4); font-size: 0.55em; padding: 6px 2px; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-weight: bold; flex: 1 1 30%; }
        .active-watch { color: var(--accent) !important; border-color: var(--accent); }
        .active-pulse { color: var(--glow) !important; border-color: var(--glow); }
        .active-done { color: #4caf50 !important; border-color: #4caf50; }
        .delete-btn { background: rgba(255, 68, 68, 0.05); border: 1px solid rgba(255, 68, 68, 0.2); color: #ff4444; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; border-radius: 6px; }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0); backdrop-filter: blur(0px); z-index: 6000; display: none; justify-content: center; align-items: center; padding: 20px; transition: 0.3s; }
        .modal-overlay.active { display: flex; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); }
        .modal-content { background: rgba(5, 22, 45, 0.98); border: 1px solid var(--border); border-radius: 24px; max-width: 850px; width: 100%; max-height: 85vh; position: relative; overflow-y: auto; padding: 25px; opacity: 0; transform: scale(1.05); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .modal-overlay.active .modal-content { opacity: 1; transform: scale(1); }
        .modal-inner { display: flex; flex-direction: column; gap: 20px; align-items: center; text-align: center; }
        .modal-poster { width: 180px; border-radius: 12px; }
        
        .season-hub { width: 100%; margin-top: 20px; text-align: left; background: rgba(255,255,255,0.03); border-radius: 15px; padding: 15px; }
        .episode-item { padding: 10px; border-bottom: 1px solid rgba(120,169,255,0.1); display: flex; gap: 12px; align-items: flex-start; }
        .ep-check { width: 22px; height: 22px; accent-color: var(--glow); flex-shrink: 0; margin-top: 4px; }

        #syncStatus { position: fixed; bottom: 10px; right: 10px; font-size: 9px; letter-spacing: 1px; color: var(--glow); opacity: 0.6; z-index: 5000; pointer-events: none; }
    </style>
</head>
<body>

<div id="syncStatus">SYSTEM OFFLINE</div>

<div class="user-hub" id="userHub">
    <div class="user-header">
        <div class="icon-svg icon-user" style="width:24px; height:24px; color:var(--glow);"></div>
        <span class="current-user-name" id="displayUserName">BAILEY</span>
    </div>
    <div class="user-list" id="userList"></div>
    <div class="add-user-btn" onclick="createNewProfile()">+ NEW PROFILE</div>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="nav-icon"><span></span><span></span><span></span></div></div>
    <div class="sidebar-nav">
        <button class="sidebar-btn active" onclick="setFilter('all', this)"><div class="icon-box"><div class="icon-svg icon-all"></div></div><span class="label">All Vault</span></button>
        <button class="sidebar-btn" onclick="setFilter('watching', this)"><div class="icon-box"><div class="icon-svg icon-watch"></div></div><span class="label">To Watch</span></button>
        <button class="sidebar-btn" onclick="setFilter('pulse', this)"><div class="icon-box"><div class="icon-svg icon-pulse"></div></div><span class="label">Pulse</span></button>
        <button class="sidebar-btn" onclick="setFilter('watched', this)"><div class="icon-box"><div class="icon-svg icon-done"></div></div><span class="label">Watched</span></button>
        <button class="sidebar-btn" onclick="setFilter('movie', this)"><div class="icon-box"><div class="icon-svg icon-movie"></div></div><span class="label">Movies</span></button>
        <button class="sidebar-btn" onclick="setFilter('tv', this)"><div class="icon-box"><div class="icon-svg icon-tv"></div></div><span class="label">TV Shows</span></button>
        <button class="sidebar-btn" onclick="setFilter('animated', this)"><div class="icon-box"><div class="icon-svg icon-animated"></div></div><span class="label">Animated</span></button>
        <button class="sidebar-btn" onclick="setFilter('anime', this)"><div class="icon-box"><div class="icon-svg icon-anime"></div></div><span class="label">Anime</span></button>
        <div style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1);">
            <button class="sidebar-btn" onclick="pickRandom()"><div class="icon-box"><div class="icon-svg icon-dice"></div></div><span class="label">Surprise</span></button>
            <button class="sidebar-btn" onclick="openKeyModal()"><div class="icon-box"><div class="icon-svg icon-key"></div></div><span class="label">API Key</span></button>
        </div>
    </div>
</div>

<div class="main-wrapper">
    <div class="command-deck">
        <div class="input-group">
            <input type="text" id="showInput" placeholder="Add new title...">
            <button id="add-btn" onclick="performFullSearch()">ENGAGE</button>
            <ul id="autocomplete-list"></ul>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Filter view..." onkeyup="render()">
    </div>
    <div class="container">
        <button id="backToVault" class="back-btn" style="display:none; margin-bottom: 20px; width: 100%; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: #fff; padding: 10px; border-radius: 10px;" onclick="exitSearchMode()">← BACK TO ARCHIVE</button>
        <h1 id="pageTitle">THE VAULT</h1>
        <ul id="showList"></ul>
    </div>
</div>

<div id="detailsModal" class="modal-overlay" onclick="if(event.target === this) closeModal()">
    <div class="modal-content" id="modalBody"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAf9NqhQ8iGoVWeCCCoZChF1RKY-HER678",
        authDomain: "the-vault-41656.firebaseapp.com",
        projectId: "the-vault-41656",
        storageBucket: "the-vault-41656.firebasestorage.app",
        messagingSenderId: "8990033543",
        appId: "1:8990033543:web:1579e3987a69f9ffcd1a22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.vaultDB = db;
    window.firestore = { doc, setDoc, onSnapshot, getDoc };
    setupCloudSync();
</script>

<script>
    let users = JSON.parse(localStorage.getItem('vaultUsers')) || [{ name: 'BAILEY', id: 'user_bailey' }];
    let activeUserId = localStorage.getItem('activeVaultUser') || 'user_bailey';
    let mediaList = [];
    let tmdbKey = localStorage.getItem('tmdbKey') || '';
    let currentFilter = 'all';
    let searchResults = [];
    let isSearchMode = false;
    let unsubscribe = null;

    async function setupCloudSync() {
        if (unsubscribe) unsubscribe();
        const status = document.getElementById('syncStatus');
        status.innerText = "CONNECTING...";
        const userDocRef = window.firestore.doc(window.vaultDB, "archives", activeUserId);

        unsubscribe = window.firestore.onSnapshot(userDocRef, (doc) => {
            if (doc.exists()) {
                mediaList = doc.data().list || [];
                status.innerText = "CLOUD SYNCED";
                render();
            } else {
                status.innerText = "CLOUD READY";
            }
        });
    }

    async function saveMediaList() {
        const userDocRef = window.firestore.doc(window.vaultDB, "archives", activeUserId);
        await window.firestore.setDoc(userDocRef, { list: mediaList });
        localStorage.setItem('sgcData_' + activeUserId, JSON.stringify(mediaList));
    }

    // --- RENDER LOGIC ---
    function render() {
        if(isSearchMode) return;
        const listEl = document.getElementById('showList');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        listEl.innerHTML = '';
        mediaList.forEach((item, index) => {
            let pass = (currentFilter === 'all') || (currentFilter === item.status) || (currentFilter === item.type) || (currentFilter === 'anime' && item.isAnime) || (currentFilter === 'animated' && item.isAnimated);
            if (item.name.toLowerCase().includes(searchTerm) && pass) {
                const li = document.createElement('li');
                let progressUI = (item.type === 'tv' && item.totalEpisodes) ? `<div class="progress-container"><div class="progress-fill" style="width:${((item.checkedEpisodes?.length || 0) / item.totalEpisodes) * 100}%"></div></div>` : '';
                li.innerHTML = `
                    <div class="poster-container" onclick="openModal(${index})"><img class="poster" src="${item.poster || ''}"></div>
                    <div class="info" onclick="openModal(${index})"><strong>${item.name}</strong>${progressUI}</div>
                    <div class="controls">
                        <button class="state-btn ${item.status === 'watching' ? 'active-watch' : ''}" onclick="setStatus(${index}, 'watching')">Watch</button>
                        <button class="state-btn ${item.status === 'pulse' ? 'active-pulse' : ''}" onclick="setStatus(${index}, 'pulse')">Pulse</button>
                        <button class="state-btn ${item.status === 'watched' ? 'active-done' : ''}" onclick="setStatus(${index}, 'watched')">Done</button>
                    </div>`;
                listEl.appendChild(li);
            }
        });
    }

    // --- SEARCH LOGIC ---
    async function performFullSearch() {
        const q = document.getElementById('showInput').value.trim();
        if(!q || !tmdbKey) return;
        try {
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&query=${encodeURIComponent(q)}&include_adult=false`);
            const data = await res.json();
            searchResults = data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv');
            isSearchMode = true;
            document.getElementById('pageTitle').innerText = "SEARCH RESULTS";
            document.getElementById('backToVault').style.display = 'block';
            renderSearchResults();
        } catch(e){}
    }

    function renderSearchResults() {
        const listEl = document.getElementById('showList');
        listEl.innerHTML = '';
        searchResults.forEach(item => {
            const li = document.createElement('li');
            const itemId = item.id;
            const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';
            li.innerHTML = `
                <div class="poster-container"><img class="poster" src="${poster}"></div>
                <div class="info"><strong>${item.title || item.name}</strong></div>
                <button class="state-btn active-pulse" onclick='addFromTMDB(${JSON.stringify(item).replace(/'/g, "")})'>ADD TO VAULT</button>`;
            listEl.appendChild(li);
        });
    }

    function addFromTMDB(item) {
        if (!mediaList.some(v => v.tmdbId === item.id)) {
            mediaList.unshift({ name: item.title || item.name, status: 'watching', poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '', type: item.media_type, tmdbId: item.id, checkedEpisodes: [] });
            saveMediaList();
        }
        exitSearchMode();
    }

    function setStatus(idx, s) { mediaList[idx].status = s; saveMediaList(); render(); }
    function exitSearchMode() { isSearchMode = false; document.getElementById('backToVault').style.display='none'; document.getElementById('pageTitle').innerText="THE VAULT"; render(); }
    function setFilter(f, btn) { currentFilter = f; document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
    function closeModal() { document.getElementById('detailsModal').classList.remove('active'); }
    function openKeyModal() { const k = prompt("Enter TMDB Key:", tmdbKey); if(k) { tmdbKey = k; localStorage.setItem('tmdbKey', k); } }

    async function openModal(index) {
        const item = mediaList[index];
        const body = document.getElementById('modalBody');
        document.getElementById('detailsModal').classList.add('active');
        body.innerHTML = 'Loading...';
        try {
            const res = await fetch(`https://api.themoviedb.org/3/${item.type}/${item.tmdbId}?api_key=${tmdbKey}`);
            const data = await res.json();
            if (item.type === 'tv') item.totalEpisodes = data.number_of_episodes;
            body.innerHTML = `
                <div class="modal-inner">
                    <img src="${item.poster}" class="modal-poster">
                    <h2>${item.name}</h2>
                    <p style="font-size:0.8em; opacity:0.8;">${data.overview}</p>
                    <button class="state-btn" style="color:#ff4444;" onclick="deleteItem(${index})">DELETE ENTRY</button>
                    <div id="episodeDisplay"></div>
                </div>`;
        } catch(e){}
    }
    function deleteItem(idx) { mediaList.splice(idx, 1); saveMediaList(); closeModal(); render(); }
</script>
</body>
</html>
