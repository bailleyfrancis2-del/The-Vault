<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Vault</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #050a15; color: #fff; }
        .container { padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .item { background: #111; border: 1px solid #333; border-radius: 10px; padding: 10px; }
        .poster { width: 100%; aspect-ratio: 2/3; border-radius: 8px; object-fit: cover; }
        .controls { display: flex; gap: 5px; margin-top: 10px; }
        .pill { 
            flex: 1; font-size: 10px; padding: 8px 0; border: 1px solid #444; 
            text-align: center; cursor: pointer; border-radius: 4px; color: #666;
        }
        .active-w { border-color: #ffcc00; color: #ffcc00; }
        .active-p { border-color: #78a9ff; color: #78a9ff; }
        .active-d { border-color: #4caf50; color: #4caf50; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; color: #fff; border: 1px solid #333; }
        .btn { background: #78a9ff; padding: 10px; text-align: center; color: #000; cursor: pointer; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <input type="text" id="qIn" placeholder="Search...">
    <div class="btn" onclick="search()">SEARCH</div>
    <p></p>
    <div class="grid" id="grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const config = {
        apiKey: "AIzaSyAf9NqhQ8iGoVWeCCCoZChF1RKY-HER678",
        authDomain: "the-vault-41656.firebaseapp.com",
        projectId: "the-vault-41656",
        storageBucket: "the-vault-41656.firebasestorage.app",
        messagingSenderId: "8990033543",
        appId: "1:8990033543:web:1579e3987a69f9ffcd1a22"
    };

    const app = initializeApp(config);
    const db = getFirestore(app);

    window.sync = async () => {
        await setDoc(doc(db, "archives", "user_bailey"), { list: window.mediaList });
    };

    const snap = await getDoc(doc(db, "archives", "user_bailey"));
    if(snap.exists()) {
        window.mediaList = snap.data().list || [];
        render();
    }
</script>

<script>
    window.mediaList = [];

    function render() {
        const g = document.getElementById('grid');
        g.innerHTML = '';
        window.mediaList.forEach((item, i) => {
            const d = document.createElement('div');
            d.className = 'item';
            d.innerHTML = `
                <img class="poster" src="${item.poster}">
                <div class="controls">
                    <div class="pill ${item.status==='watching'?'active-w':''}" onclick="setS(${i},'watching',this)">W</div>
                    <div class="pill ${item.status==='pulse'?'active-p':''}" onclick="setS(${i},'pulse',this)">P</div>
                    <div class="pill ${item.status==='watched'?'active-d':''}" onclick="setS(${i},'watched',this)">D</div>
                </div>`;
            g.appendChild(d);
        });
    }

    window.setS = (idx, s, el) => {
        window.mediaList[idx].status = s;
        const ps = el.parentElement.querySelectorAll('.pill');
        ps.forEach(p => p.classList.remove('active-w', 'active-p', 'active-d'));
        if(s==='watching') el.classList.add('active-w');
        if(s==='pulse') el.classList.add('active-p');
        if(s==='watched') el.classList.add('active-d');
        // We only sync to cloud on refresh or add to stop the flickering
        localStorage.setItem('v_cache', JSON.stringify(window.mediaList));
    };

    async function search() {
        const q = document.getElementById('qIn').value;
        const key = localStorage.getItem('tmdbKey');
        const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${key}&query=${q}`);
        const d = await r.json();
        const g = document.getElementById('grid');
        g.innerHTML = d.results.filter(i => i.poster_path).map(item => `
            <div class="item">
                <img class="poster" src="https://image.tmdb.org/t/p/w500${item.poster_path}">
                <div class="btn" onclick="add('${item.title || item.name}','https://image.tmdb.org/t/p/w500${item.poster_path}',${item.id})">ADD</div>
            </div>`).join('');
    }

    window.add = (n, p, id) => {
        window.mediaList.unshift({ name: n, poster: p, tmdbId: id, status: 'watching' });
        window.sync();
        render();
    };
</script>
</body>
</html>
