<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Vault</title>
    <style>
        :root {
            --glass: rgba(10, 15, 25, 0.97);
            --border: rgba(120, 169, 255, 0.3);
            --glow: #78a9ff;
            --accent: #ffcc00; 
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --glide: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed;
            font-family: -apple-system, system-ui, sans-serif;
            background: #050a15 url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2022&auto=format&fit=crop') center/cover fixed;
            color: #fff;
        }

        .app-container {
            height: 100%; display: flex; flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: calc(75px + var(--safe-bottom));
        }

        .scroll-view { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }

        .media-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; width: 100%;
        }

        @media (min-width: 800px) {
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
            .app-container { padding-bottom: 20px; }
            .bottom-nav { width: 500px; left: 50% !important; transform: translateX(-50%); border-radius: 40px; bottom: 25px !important; }
        }

        .card { background: var(--glass); backdrop-filter: blur(35px); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 20px; }

        .item-card {
            background: rgba(255,255,255,0.03); border-radius: 20px;
            padding: 10px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 10px;
        }
        
        .poster { width: 100%; aspect-ratio: 2/3; border-radius: 14px; object-fit: cover; background: #111; }
        .title { font-size: 0.85em; font-weight: 600; text-align: center; min-height: 2.4em; color: rgba(255,255,255,0.9); }

        .controls { display: flex; gap: 4px; width: 100%; }
        .btn-status { 
            flex: 1; font-size: 8px; padding: 10px 0; border-radius: 9px; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: rgba(255,255,255,0.4);
            text-transform: uppercase; font-weight: 800; white-space: nowrap;
            transition: all 0.3s ease;
        }
        .active-watch { border-color: var(--accent) !important; color: var(--accent) !important; background: rgba(255,204,0,0.1) !important; }
        .active-pulse { border-color: var(--glow) !important; color: var(--glow) !important; background: rgba(120,169,255,0.1) !important; }
        .active-done { border-color: #4caf50 !important; color: #4caf50 !important; background: rgba(76,175,80,0.1) !important; }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 9000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.8s var(--glide);
        }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { 
            width: 92%; max-width: 450px; max-height: 82vh; background: #0a111f; 
            border: 1px solid var(--border); border-radius: 30px; padding: 30px; overflow-y: auto; 
            transform: scale(0.9) translate3d(0, 50px, 0); 
            transition: transform 1.0s var(--glide);
        }
        .modal.active .modal-content { transform: scale(1) translate3d(0, 0, 0); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(75px + var(--safe-bottom));
            background: rgba(0,0,0,0.95); backdrop-filter: blur(35px); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; padding-bottom: var(--safe-bottom); z-index: 5000;
        }
        .nav-item { background: none; border: none; color: rgba(255,255,255,0.3); display: flex; flex-direction: column; align-items: center; font-size: 10px; flex: 1; }
        .nav-item.active { color: var(--glow); }
        .nav-icon { width: 24px; height: 24px; background: currentColor; mask-size: contain; mask-repeat: no-repeat; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; margin-bottom: 5px; }

        .btn-main { background: var(--glow); color: #05162d; border: none; padding: 12px 20px; border-radius: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 14px; font-size: 16px !important; }
        
        .settings-row { margin-bottom: 20px; }
        .settings-label { font-size: 11px; color: var(--glow); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .sync-indicator { font-size: 13px; font-weight: bold; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid var(--border); color: #fff; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="scroll-view">
        <div class="card">
            <h2 id="pageTitle" style="margin: 0 0 15px 0; font-size: 1.4em; letter-spacing: 4px; font-weight: 300; text-align: center;">THE VAULT</h2>
            <div class="search-row" style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="showInput" placeholder="Initialize Entry..." onkeydown="if(event.key==='Enter') performFullSearch()">
                <button class="btn-main" onclick="performFullSearch()">ENGAGE</button>
            </div>
            <input type="text" id="filterInput" style="width:100%; height:42px; background:rgba(0,0,0,0.3);" placeholder="Search Archive..." onkeyup="render()">
        </div>
        <button id="backBtn" class="btn-main" style="display:none; width:100%; margin-bottom:20px; padding:18px;" onclick="exitSearch()">← RETURN TO ARCHIVE</button>
        <div class="media-grid" id="mainGrid"></div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="setFilter('all', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:stack-bold.svg')"></div>All Vault</button>
    <button class="nav-item" onclick="setFilter('watching', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:clock-bold.svg')"></div>To Watch</button>
    <button class="nav-item" onclick="setFilter('pulse', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:activity-bold.svg')"></div>Pulse</button>
    <button class="nav-item" onclick="setFilter('animated', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:rocket-launch-bold.svg')"></div>Animated</button>
    <button class="nav-item" onclick="openSystemPanel()"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:gear-bold.svg')"></div>Settings</button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalBody"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAf9NqhQ8iGoVWeCCCoZChF1RKY-HER678",
        authDomain: "the-vault-41656.firebaseapp.com",
        projectId: "the-vault-41656",
        storageBucket: "the-vault-41656.firebasestorage.app",
        messagingSenderId: "8990033543",
        appId: "1:8990033543:web:1579e3987a69f9ffcd1a22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.vaultDB = db;
    window.firestore = { doc, setDoc, onSnapshot };
    
    const cache = localStorage.getItem('vault_cache_bailey');
    if(cache) {
        window.mediaList = JSON.parse(cache);
        render();
    }

    // TRACK LOCAL ACTION TIME
    window.lastLocalAction = 0;

    window.firestore.onSnapshot(window.firestore.doc(db, "archives", "user_bailey"), (doc) => {
        if(doc.exists()) {
            const newList = doc.data().list || [];
            
            // IF we did something locally in the last 5 seconds, IGNORE cloud updates
            const isSelfSync = (Date.now() - window.lastLocalAction) < 5000;
            
            if (!isSelfSync && JSON.stringify(newList) !== JSON.stringify(window.mediaList)) {
                window.mediaList = newList;
                localStorage.setItem('vault_cache_bailey', JSON.stringify(window.mediaList));
                render();
            }
            window.syncMsg = "CLOUD SYNCED";
            updateSyncDisplay();
        }
    });
</script>

<script>
    window.mediaList = window.mediaList || [];
    window.syncMsg = "INITIALIZING...";
    let tmdbKey = localStorage.getItem('tmdbKey') || '';
    let currentFilter = 'all';
    let isSearch = false;

    async function save() {
        window.lastLocalAction = Date.now(); // SET THE BLOCKER
        localStorage.setItem('vault_cache_bailey', JSON.stringify(window.mediaList));
        await window.firestore.setDoc(window.firestore.doc(window.vaultDB, "archives", "user_bailey"), { list: window.mediaList });
    }

    function render() {
        if(isSearch) return;
        const grid = document.getElementById('mainGrid');
        const filterStr = document.getElementById('filterInput').value.toLowerCase();
        grid.innerHTML = '';
        window.mediaList.forEach((item, idx) => {
            const passF = (currentFilter === 'all') || (currentFilter === item.status) || (currentFilter === 'animated' && (item.isAnimated || item.isAnime));
            if(item.name.toLowerCase().includes(filterStr) && passF) {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <img class="poster" src="${item.poster}" onclick="openItem(${idx})">
                    <div class="title" onclick="openItem(${idx})">${item.name}</div>
                    <div class="controls">
                        <button class="btn-status ${item.status==='watching'?'active-watch':''}" onclick="setStatus(${idx},'watching', this)">To Watch</button>
                        <button class="btn-status ${item.status==='pulse'?'active-pulse':''}" onclick="setStatus(${idx},'pulse', this)">Pulse</button>
                        <button class="btn-status ${item.status==='watched'?'active-done':''}" onclick="setStatus(${idx},'watched', this)">Done</button>
                    </div>`;
                grid.appendChild(div);
            }
        });
    }

    function setStatus(idx, s, btnEl) { 
        window.lastLocalAction = Date.now(); // BLOCK THE FLICKER
        window.mediaList[idx].status = s; 
        save(); 

        const controls = btnEl.parentElement;
        const btns = controls.querySelectorAll('.btn-status');
        btns.forEach(b => b.classList.remove('active-watch', 'active-pulse', 'active-done'));
        
        if (s === 'watching') btnEl.classList.add('active-watch');
        else if (s === 'pulse') btnEl.classList.add('active-pulse');
        else if (s === 'watched') btnEl.classList.add('active-done');
        
        // NO RENDER() CALL. NO REFRESH.
    }

    async function performFullSearch() {
        const q = document.getElementById('showInput').value;
        if(!q || !tmdbKey) return;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&query=${encodeURIComponent(q)}&include_adult=false`);
        const data = await res.json();
        const results = data.results.filter(i => i.media_type !== 'person');
        isSearch = true;
        document.getElementById('backBtn').style.display = 'block';
        document.getElementById('pageTitle').innerText = "DISCOVERING...";
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        results.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<img class="poster" src="https://image.tmdb.org/t/p/w500${item.poster_path}"><div class="title">${item.title || item.name}</div><button class="btn-main" style="width:100%; font-size:11px;" onclick='addItem(${JSON.stringify(item).replace(/'/g, "")})'>ENGAGE</button>`;
            grid.appendChild(div);
        });
    }

    function addItem(item) {
        window.lastLocalAction = Date.now();
        if(!window.mediaList.some(v => v.tmdbId === item.id)) {
            window.mediaList.unshift({ name: item.title || item.name, status: 'watching', poster: `https://image.tmdb.org/t/p/w500${item.poster_path}`, type: item.media_type, tmdbId: item.id, isAnimated: item.genre_ids?.includes(16), checkedEpisodes: [] });
            save();
            render();
        }
    }

    function exitSearch() { isSearch = false; document.getElementById('backBtn').style.display='none'; document.getElementById('pageTitle').innerText="THE VAULT"; render(); }
    function setFilter(f, btn) { if(isSearch) exitSearch(); currentFilter = f; document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
    
    function openSystemPanel() {
        const modal = document.getElementById('modal');
        const body = document.getElementById('modalBody');
        modal.classList.add('active');
        body.innerHTML = `
            <div style="text-align:center;">
                <h3 style="color:var(--glow); letter-spacing:3px;">SYSTEM SETTINGS</h3>
                <div class="settings-row">
                    <span class="settings-label">Cloud Status</span>
                    <div id="syncIndicator" class="sync-indicator">${window.syncMsg}</div>
                </div>
                <div class="settings-row">
                    <span class="settings-label">TMDB Gateway Key</span>
                    <input type="text" id="tmdbInput" style="width:100%;" value="${tmdbKey}" placeholder="Paste Key...">
                </div>
                <button class="btn-main" style="width:100%; margin-bottom:10px;" onclick="saveSystem()">SAVE CHANGES</button>
                <button class="btn-main" style="width:100%; background:transparent; color:#888; border:1px solid #333;" onclick="closeModal()">CANCEL</button>
            </div>
        `;
    }

    function saveSystem() {
        const val = document.getElementById('tmdbInput').value;
        tmdbKey = val;
        localStorage.setItem('tmdbKey', val);
        closeModal();
    }

    function updateSyncDisplay() {
        const el = document.getElementById('syncIndicator');
        if(el) el.innerText = window.syncMsg;
    }

    async function openItem(idx) {
        const item = window.mediaList[idx];
        const modal = document.getElementById('modal');
        const body = document.getElementById('modalBody');
        modal.classList.add('active');
        body.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.5;">LOADING MISSION LOGS...</div>';
        try {
            const res = await fetch(`https://api.themoviedb.org/3/${item.type}/${item.tmdbId}?api_key=${tmdbKey}`);
            const data = await res.json();
            body.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; text-align:center;">
                    <img src="${item.poster}" style="width:140px; border-radius:18px; margin-bottom:20px;">
                    <h3 style="color:var(--glow); margin:0;">${item.name}</h3>
                    <p style="font-size:0.9em; line-height:1.6; opacity:0.7; margin:15px 0;">${data.overview || 'Summary unavailable.'}</p>
                    <button class="btn-main" style="background:var(--accent); width:100%; margin-bottom:10px;" onclick="toggleTag(${idx}, 'isAnimated')">${item.isAnimated?'REMOVE TOON TAG':'TAG AS TOON'}</button>
                    <button class="btn-main" style="background:rgba(255, 68, 68, 0.1); color:#ff4444; border:1px solid rgba(255, 68, 68, 0.3); width:100%;" onclick="deleteItem(${idx})">ERASE RECORD</button>
                    <div id="epArea" style="width:100%;"></div>
                </div>`;
            if(item.type === 'tv') loadEpisodes(idx);
        } catch(e) { body.innerHTML = 'Error.'; }
    }

    async function loadEpisodes(idx) {
        const item = window.mediaList[idx];
        const res = await fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}?api_key=${tmdbKey}`);
        const data = await res.json();
        document.getElementById('epArea').innerHTML = `<select class="btn-main" style="width:100%; background:#000; color:#fff; height:50px; margin:20px 0 15px 0;" onchange="fetchSeason(${idx}, this.value)"><option>SELECT SEASON</option>${data.seasons.map(s=>`<option value="${s.season_number}">${s.name}</option>`).join('')}</select><div id="epList"></div>`;
    }

    async function fetchSeason(idx, sNum) {
        const item = window.mediaList[idx];
        const res = await fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}/season/${sNum}?api_key=${tmdbKey}`);
        const data = await res.json();
        document.getElementById('epList').innerHTML = data.episodes.map(ep => `<div style="display:flex; gap:15px; margin-bottom:18px; border-bottom:1px solid #222; padding-bottom:12px; text-align:left;"><input type="checkbox" style="width:28px; height:28px; accent-color:var(--glow);" ${item.checkedEpisodes?.includes(ep.id)?'checked':''} onchange="toggleEp(${idx},${ep.id})"><div><strong>${ep.episode_number}. ${ep.name}</strong></div></div>`).join('');
    }

    function toggleEp(idx, id) { 
        window.lastLocalAction = Date.now();
        if(!window.mediaList[idx].checkedEpisodes) window.mediaList[idx].checkedEpisodes = []; 
        const i = window.mediaList[idx].checkedEpisodes.indexOf(id); 
        if(i > -1) window.mediaList[idx].checkedEpisodes.splice(i, 1); 
        else { window.mediaList[idx].checkedEpisodes.push(id); if(window.mediaList[idx].status==='watching') window.mediaList[idx].status = 'pulse'; } 
        save(); 
    }
    function toggleTag(idx, p) { window.lastLocalAction = Date.now(); window.mediaList[idx][p] = !window.mediaList[idx][p]; save(); openItem(idx); }
    function deleteItem(idx) { window.lastLocalAction = Date.now(); if(confirm("Delete?")) { window.mediaList.splice(idx, 1); save(); closeModal(); render(); } }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }
</script>
</body>
</html>
