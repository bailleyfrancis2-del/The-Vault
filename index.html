<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Vault</title>
    <style>
        :root {
            --glass: rgba(10, 15, 25, 0.98);
            --border: rgba(120, 169, 255, 0.2);
            --glow: #78a9ff;
            --accent: #ffcc00;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --glide: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; position: fixed;
            font-family: -apple-system, system-ui, sans-serif;
            background: #050a15 url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2022&auto=format&fit=crop') center/cover fixed;
            color: #fff;
        }

        /* ── LOGIN SCREEN ────────────────────────────────────────────────── */
        #loginScreen {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: #050a15 url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2022&auto=format&fit=crop') center/cover fixed;
            transition: opacity 0.5s var(--glide), transform 0.5s var(--glide);
        }
        #loginScreen.hidden {
            opacity: 0; pointer-events: none; transform: scale(1.05);
        }

        .login-card {
            width: 92%; max-width: 360px;
            background: var(--glass); backdrop-filter: blur(40px);
            border: 1px solid var(--border); border-radius: 32px;
            padding: 36px 28px; text-align: center;
        }

        .login-title {
            font-size: 1.4em; letter-spacing: 6px; font-weight: 300;
            opacity: 0.8; margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 12px; opacity: 0.35; letter-spacing: 2px;
            margin-bottom: 28px; text-transform: uppercase;
        }

        .login-input {
            width: 100%; background: rgba(0,0,0,0.6);
            border: 1px solid var(--border); color: #fff;
            padding: 14px; border-radius: 16px; font-size: 16px !important;
            margin-bottom: 12px; text-align: center;
        }

        .pin-dots {
            display: flex; justify-content: center; gap: 12px;
            margin-bottom: 20px;
        }
        .pin-dot {
            width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid var(--border); background: transparent;
            transition: all 0.2s var(--spring);
        }
        .pin-dot.filled { background: var(--glow); border-color: var(--glow); }

        .pin-pad {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 20px; max-width: 260px; margin-left: auto; margin-right: auto;
        }
        .pin-key {
            height: 56px; border-radius: 16px;
            background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            color: #fff; font-size: 22px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.15s var(--spring);
        }
        .pin-key:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
        .pin-key.fn { font-size: 12px; letter-spacing: 1px; font-weight: 700; }

        .login-btn {
            width: 100%; padding: 16px; border-radius: 16px;
            font-weight: 800; font-size: 13px; letter-spacing: 2px;
            border: none; cursor: pointer; transition: all 0.2s;
            margin-bottom: 10px;
        }

        .login-toggle {
            font-size: 12px; opacity: 0.4; cursor: pointer;
            text-decoration: underline; margin-top: 6px;
        }
        .login-toggle:active { opacity: 0.8; }

        .login-error {
            font-size: 12px; color: #ff4444; margin-bottom: 12px;
            min-height: 18px;
        }

        /* ── MAIN APP (unchanged styles) ─────────────────────────────────── */
        .app-container {
            height: 100%; display: flex; flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: calc(75px + var(--safe-bottom));
            overflow: hidden;
        }

        .scroll-view {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px; width: 100%;
            padding-bottom: 20px;
        }

        .header-card {
            background: var(--glass); backdrop-filter: blur(40px);
            border: 1px solid var(--border); border-radius: 28px;
            padding: 20px; margin-bottom: 20px;
        }

        .swipe-wrapper {
            position: relative; border-radius: 22px;
            overflow: hidden; background: #070d1a;
            touch-action: pan-y;
        }

        .action-tray {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 1; background: #070d1a;
        }

        .tray-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; padding: 10px;
        }

        .tray-btn {
            width: 52px; height: 52px; border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 8px; font-weight: 900;
            letter-spacing: 0.5px; text-transform: uppercase;
            cursor: pointer; border: none; gap: 3px;
            transition: transform 0.15s var(--spring), filter 0.15s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .tray-btn:active { transform: scale(0.88); filter: brightness(1.2); }

        .tray-icon {
            width: 18px; height: 18px;
            mask-size: contain; mask-repeat: no-repeat;
            -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat;
        }

        .item-card {
            position: relative; z-index: 2;
            background: #000; border-radius: 22px; overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.45s var(--spring);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            will-change: transform;
        }
        .item-card.dragging { transition: none !important; }

        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; pointer-events: none; }

        .status-badge {
            position: absolute; top: 12px; right: 12px;
            width: 10px; height: 10px; border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .card-progress {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 3px; background: rgba(255,255,255,0.1);
        }
        .card-progress-fill {
            height: 100%; background: var(--glow);
            transition: width 0.4s var(--glide);
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(75px + var(--safe-bottom));
            background: rgba(0,0,0,0.96); backdrop-filter: blur(40px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: var(--safe-bottom); z-index: 5000;
        }
        .nav-item { background: none; border: none; color: rgba(255,255,255,0.25); display: flex; flex-direction: column; align-items: center; font-size: 10px; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--glow); }
        .nav-icon { width: 24px; height: 24px; background: currentColor; mask-size: contain; mask-repeat: no-repeat; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; margin-bottom: 5px; }

        .btn-main { background: var(--glow); color: #05162d; border: none; padding: 12px 20px; border-radius: 16px; font-weight: bold; cursor: pointer; }
        .btn-rand { background: var(--accent); color: #000; border: none; width: 100%; margin-top: 12px; padding: 14px; font-size: 12px; font-weight: 900; letter-spacing: 2px; border-radius: 16px; cursor: pointer; }

        input { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 16px; font-size: 16px !important; }

        #scrollTopBtn {
            position: fixed; bottom: calc(90px + var(--safe-bottom)); right: 20px;
            width: 58px; height: 58px; background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px); border: 1px solid rgba(120,169,255,0.4);
            z-index: 4000; opacity: 0; pointer-events: none; transition: all 0.5s var(--glide);
            transform: translateY(30px) scale(0.7); border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .arrow-shape { width: 32px; height: 32px; background-color: var(--glow); -webkit-mask: url('https://api.iconify.design/ph:caret-double-up-bold.svg') no-repeat center; mask-size: contain; }
        #scrollTopBtn.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        #detailPage {
            position: fixed; inset: 0; background: #050a15;
            z-index: 8000; transform: translateX(100%);
            transition: transform 0.4s var(--glide);
            display: flex; flex-direction: column; padding-top: var(--safe-top);
        }
        #detailPage.open { transform: translateX(0); }

        .detail-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 40px; }
        .detail-hero { position: relative; width: 100%; aspect-ratio: 2/3; max-height: 55vh; overflow: hidden; }
        .detail-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .detail-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5,10,21,0.3) 0%, rgba(5,10,21,0) 40%, rgba(5,10,21,1) 100%); }
        .detail-back {
            position: absolute; top: 16px; left: 16px;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
        }
        .detail-back-icon {
            width: 20px; height: 20px; background: #fff;
            -webkit-mask: url('https://api.iconify.design/ph:arrow-left-bold.svg') no-repeat center;
            mask: url('https://api.iconify.design/ph:arrow-left-bold.svg') no-repeat center;
            mask-size: contain;
        }
        .detail-body { padding: 0 20px 20px; margin-top: -30px; position: relative; }
        .detail-title { font-size: 1.5em; font-weight: 700; margin: 0 0 6px; }
        .detail-meta { font-size: 12px; opacity: 0.5; margin-bottom: 14px; letter-spacing: 1px; text-transform: uppercase; }
        .detail-overview { font-size: 13px; line-height: 1.6; opacity: 0.7; margin-bottom: 20px; }
        .detail-actions { display: flex; gap: 10px; margin-bottom: 24px; }
        .detail-actions a, .detail-actions button {
            flex: 1; padding: 14px; border-radius: 16px; font-weight: 800;
            font-size: 12px; letter-spacing: 1px; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer;
        }
        .movie-watched-btn {
            width: 100%; padding: 16px; border-radius: 16px;
            font-weight: 800; font-size: 13px; letter-spacing: 2px;
            border: none; cursor: pointer; margin-bottom: 24px;
            transition: background 0.3s, color 0.3s;
        }
        .season-tabs {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
            margin-bottom: 16px; scrollbar-width: none;
        }
        .season-tabs::-webkit-scrollbar { display: none; }
        .season-tab {
            flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            background: rgba(255,255,255,0.07); border: 1px solid var(--border);
            color: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.2s;
        }
        .season-tab.active { background: var(--glow); color: #05162d; border-color: var(--glow); }
        .episode-list { display: flex; flex-direction: column; gap: 2px; }
        .episode-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 14px;
            background: rgba(255,255,255,0.04); transition: background 0.2s; cursor: pointer;
        }
        .episode-row.watched { background: rgba(120,169,255,0.08); }
        .episode-row:active { background: rgba(255,255,255,0.1); }
        .ep-check {
            width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s var(--spring);
        }
        .episode-row.watched .ep-check { background: var(--glow); border-color: var(--glow); }
        .ep-check-icon {
            width: 12px; height: 12px; background: #05162d;
            -webkit-mask: url('https://api.iconify.design/ph:check-bold.svg') no-repeat center;
            mask: url('https://api.iconify.design/ph:check-bold.svg') no-repeat center;
            mask-size: contain; opacity: 0; transition: opacity 0.2s;
        }
        .episode-row.watched .ep-check-icon { opacity: 1; }
        .ep-info { flex: 1; min-width: 0; }
        .ep-num { font-size: 11px; opacity: 0.4; font-weight: 600; letter-spacing: 1px; }
        .ep-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-season-progress { font-size: 11px; opacity: 0.4; font-weight: 600; margin-bottom: 10px; letter-spacing: 1px; }
        .section-title { font-size: 11px; font-weight: 800; letter-spacing: 3px; opacity: 0.4; text-transform: uppercase; margin-bottom: 12px; }

        .provider-section { margin-bottom: 20px; }
        .provider-row {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
        }
        .provider-logo {
            width: 44px; height: 44px; border-radius: 12px;
            object-fit: cover; border: 1px solid var(--border);
        }
        .provider-label {
            font-size: 10px; font-weight: 700; letter-spacing: 1px;
            opacity: 0.35; text-transform: uppercase; margin-bottom: 8px;
        }

        /* Settings/Stats page */
        #settingsPage {
            position: fixed; inset: 0; background: #050a15;
            z-index: 8000; transform: translateX(100%);
            transition: transform 0.4s var(--glide);
            display: flex; flex-direction: column; padding-top: var(--safe-top);
        }
        #settingsPage.open { transform: translateX(0); }
        .settings-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 20px 60px; }
        .settings-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; padding-top: 8px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .stat-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 4px;
        }
        .stat-value { font-size: 2em; font-weight: 800; color: var(--glow); line-height: 1; }
        .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; opacity: 0.4; text-transform: uppercase; }
        .status-bar-row { margin-bottom: 14px; }
        .status-bar-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; opacity: 0.7; }
        .status-bar-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
        .status-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s var(--glide); }
        .genre-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .genre-name { font-size: 12px; font-weight: 600; width: 110px; flex-shrink: 0; opacity: 0.8; }
        .genre-track { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
        .genre-fill { height: 100%; border-radius: 3px; background: var(--glow); }
        .genre-count { font-size: 11px; opacity: 0.4; width: 24px; text-align: right; flex-shrink: 0; }
        .settings-section { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 16px; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
        .settings-row-label { font-size: 13px; opacity: 0.8; }
        .settings-row-value { font-size: 12px; opacity: 0.4; font-family: monospace; }
    </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- LOGIN SCREEN                                                          -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<div id="loginScreen">
    <div class="login-card">
        <div class="login-title">THE VAULT</div>
        <div class="login-subtitle" id="loginSubtitle">ENTER CREDENTIALS</div>

        <input class="login-input" id="loginUsername" placeholder="Username" autocapitalize="off" autocorrect="off" spellcheck="false">

        <div id="loginNameField" style="display:none;">
            <input class="login-input" id="loginDisplayName" placeholder="Display Name">
        </div>

        <div class="pin-dots" id="pinDots">
            <div class="pin-dot" id="dot0"></div>
            <div class="pin-dot" id="dot1"></div>
            <div class="pin-dot" id="dot2"></div>
            <div class="pin-dot" id="dot3"></div>
        </div>

        <div class="pin-pad">
            <div class="pin-key" onclick="pinPress('1')">1</div>
            <div class="pin-key" onclick="pinPress('2')">2</div>
            <div class="pin-key" onclick="pinPress('3')">3</div>
            <div class="pin-key" onclick="pinPress('4')">4</div>
            <div class="pin-key" onclick="pinPress('5')">5</div>
            <div class="pin-key" onclick="pinPress('6')">6</div>
            <div class="pin-key" onclick="pinPress('7')">7</div>
            <div class="pin-key" onclick="pinPress('8')">8</div>
            <div class="pin-key" onclick="pinPress('9')">9</div>
            <div class="pin-key fn" onclick="pinClear()">CLR</div>
            <div class="pin-key" onclick="pinPress('0')">0</div>
            <div class="pin-key fn" onclick="pinBackspace()">←</div>
        </div>

        <div class="login-error" id="loginError"></div>

        <button class="login-btn" id="loginBtn" style="background:var(--glow);color:#05162d;" onclick="attemptLogin()">SIGN IN</button>

        <div class="login-toggle" id="loginToggle" onclick="toggleLoginMode()">Need an account? Create one</div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- MAIN APP                                                               -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<div class="app-container">
    <div class="scroll-view" id="mainScroll">
        <div class="header-card">
            <h2 style="margin:0 0 15px 0;font-size:1.3em;letter-spacing:5px;font-weight:300;text-align:center;opacity:0.8;">THE VAULT</h2>
            <div style="display:flex;gap:10px;margin-bottom:12px;">
                <input type="text" id="showInput" placeholder="Initialize..." onkeydown="if(event.key==='Enter') performSearch()">
                <button class="btn-main" style="min-width:100px;" onclick="performSearch()">ENGAGE</button>
            </div>
            <div style="display:flex;gap:10px;margin-bottom:12px;">
                <input type="text" id="filterInput" style="flex:1;height:45px;" placeholder="Search Archive..." onkeyup="render()">
                <select id="sortPicker" onchange="render()" style="background:rgba(0,0,0,0.6);border:1px solid var(--border);color:#fff;padding:0 12px;border-radius:16px;font-size:13px;font-weight:700;letter-spacing:1px;appearance:none;-webkit-appearance:none;cursor:pointer;min-width:100px;text-align:center;text-align-last:center;">
                    <option value="added">RECENT</option>
                    <option value="alpha">A – Z</option>
                    <option value="year">YEAR</option>
                    <option value="type">TYPE</option>
                </select>
            </div>
            <button class="btn-rand" onclick="randomize()">RANDOMIZE MISSION</button>
        </div>
        <button id="backBtn" class="btn-main" style="display:none;width:100%;margin-bottom:20px;padding:18px;" onclick="exitSearch()">← BACK TO VAULT</button>
        <div class="media-grid" id="mainGrid"></div>
    </div>
</div>

<div id="scrollTopBtn" onclick="scrollToTop()"><div class="arrow-shape"></div></div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="setFilter('all',this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:stack-bold.svg')"></div>Vault</button>
    <button class="nav-item" onclick="setFilter('watching',this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:bookmark-bold.svg')"></div>Watch</button>
    <button class="nav-item" onclick="setFilter('pulse',this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:activity-bold.svg')"></div>Pulse</button>
    <button class="nav-item" onclick="setFilter('watched',this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:check-circle-bold.svg')"></div>Done</button>
    <button class="nav-item" onclick="openSettings()"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:gear-bold.svg')"></div>Settings</button>
</div>

<!-- DETAIL PAGE -->
<div id="detailPage">
    <div class="detail-scroll" id="detailScroll">
        <div class="detail-hero">
            <img id="detailPoster" src="" alt="">
            <div class="detail-hero-overlay"></div>
            <div class="detail-back" onclick="closeDetail()"><div class="detail-back-icon"></div></div>
        </div>
        <div class="detail-body">
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-meta" id="detailMeta"></div>
            <div class="detail-overview" id="detailOverview"></div>
            <div class="detail-actions" id="detailActions"></div>
            <div id="detailProviders"></div>
            <div id="detailTracker"></div>
        </div>
    </div>
</div>

<!-- SETTINGS / STATS PAGE -->
<div id="settingsPage">
    <div class="settings-scroll">
        <div class="settings-header">
            <div class="detail-back" style="position:relative;top:auto;left:auto;flex-shrink:0;" onclick="closeSettings()"><div class="detail-back-icon"></div></div>
            <h2 style="margin:0;font-size:1.3em;letter-spacing:4px;font-weight:300;opacity:0.8;">SYSTEM</h2>
        </div>

        <div class="section-title">LOGGED IN AS</div>
        <div class="settings-section" style="margin-bottom:24px;">
            <div class="settings-row">
                <span class="settings-row-label" id="settingsUserDisplay">—</span>
                <span class="settings-row-value" id="settingsUsernameDisplay">—</span>
            </div>
            <button class="login-btn" style="background:#ff4444;color:#fff;margin-top:14px;font-size:12px;letter-spacing:2px;" onclick="logout()">LOGOUT</button>
        </div>

        <div class="section-title">VAULT STATS</div>
        <div class="stat-grid" id="statGrid"></div>

<!-- APP LOGIC                                                              -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<script>
    window.mediaList = [];
    var tmdbKey       = localStorage.getItem('tmdbKey') || '';
    var currentFilter = 'all';
    var isSearch      = false;
    var openCardIdx   = null;
    var currentDetailIdx = null;
    var currentSeason    = 1;
    var currentUser      = null;  // { username, displayName }
    var unsubscribe      = null;  // Firebase listener

    // ── LOGIN SYSTEM ─────────────────────────────────────────────────────────
    var loginMode = 'signin'; // 'signin' or 'signup'
    var currentPin = '';

    window.pinPress = function(n) {
        if (currentPin.length >= 4) return;
        currentPin += n;
        updatePinDots();
    };

    window.pinClear = function() {
        currentPin = '';
        updatePinDots();
    };

    window.pinBackspace = function() {
        currentPin = currentPin.slice(0, -1);
        updatePinDots();
    };

    function updatePinDots() {
        for (var i = 0; i < 4; i++) {
            document.getElementById('dot' + i).classList.toggle('filled', i < currentPin.length);
        }
    }

    window.toggleLoginMode = function() {
        loginMode = loginMode === 'signin' ? 'signup' : 'signin';
        document.getElementById('loginSubtitle').textContent = loginMode === 'signin' ? 'ENTER CREDENTIALS' : 'CREATE NEW ACCOUNT';
        document.getElementById('loginBtn').textContent = loginMode === 'signin' ? 'SIGN IN' : 'CREATE ACCOUNT';
        document.getElementById('loginToggle').textContent = loginMode === 'signin' ? 'Need an account? Create one' : 'Already have an account? Sign in';
        document.getElementById('loginNameField').style.display = loginMode === 'signup' ? 'block' : 'none';
        document.getElementById('loginError').textContent = '';
        pinClear();
    };

    window.attemptLogin = async function() {
        var username = document.getElementById('loginUsername').value.trim().toLowerCase().replace(/\s+/g, '_');
        var error    = document.getElementById('loginError');
        error.textContent = '';

        if (!username) { error.textContent = 'Enter a username'; return; }
        if (currentPin.length !== 4) { error.textContent = 'Enter a 4-digit PIN'; return; }

        var docId  = 'user_' + username;
        var docRef = window.fLib.doc(window.db, "archives", docId);

        try {
            var snap = await window.fLib.getDoc(docRef);

            if (loginMode === 'signup') {
                if (snap.exists()) {
                    var existingData = snap.data();
                    // Legacy account without PIN — migrate it
                    if (!existingData.pin) {
                        var displayName = document.getElementById('loginDisplayName').value.trim() || username;
                        await window.fLib.setDoc(docRef, { pin: currentPin, displayName: displayName }, { merge: true });
                        loginSuccess(username, displayName);
                        return;
                    }
                    error.textContent = 'Username already taken'; return;
                }
                var displayName = document.getElementById('loginDisplayName').value.trim() || username;
                await window.fLib.setDoc(docRef, { pin: currentPin, displayName: displayName, list: [] });
                loginSuccess(username, displayName);
            } else {
                if (!snap.exists()) { error.textContent = 'User not found'; return; }
                var data = snap.data();
                // Legacy account without PIN — set their PIN on first sign-in
                if (!data.pin) {
                    await window.fLib.setDoc(docRef, { pin: currentPin, displayName: data.displayName || username }, { merge: true });
                    loginSuccess(username, data.displayName || username);
                    return;
                }
                if (data.pin !== currentPin) { error.textContent = 'Incorrect PIN'; return; }
                loginSuccess(username, data.displayName || username);
            }
        } catch(err) {
            error.textContent = 'Connection error — try again';
        }
    };

    function loginSuccess(username, displayName) {
        currentUser = { username: username, displayName: displayName };
        localStorage.setItem('v_last_user', username);
        document.getElementById('loginScreen').classList.add('hidden');
        startApp();
    }

    window.checkSavedSession = function() {
        // Always show login screen, but prefill the last username for convenience
        var lastUser = localStorage.getItem('v_last_user');
        if (lastUser) {
            document.getElementById('loginUsername').value = lastUser;
        }
    };

    function startApp() {
        var docId = 'user_' + currentUser.username;

        // Load from cache first
        var cache = localStorage.getItem('v_cache_' + currentUser.username);
        if (cache) { window.mediaList = JSON.parse(cache); render(); }

        // Listen for live updates
        if (unsubscribe) unsubscribe();
        unsubscribe = window.fLib.onSnapshot(window.fLib.doc(window.db, "archives", docId), function(snap) {
            if (snap.exists()) {
                var data = snap.data();
                window.mediaList = data.list || [];
                // Load TMDB key from user's Firebase data
                if (data.tmdbKey) {
                    tmdbKey = data.tmdbKey;
                    localStorage.setItem('tmdbKey', tmdbKey);
                }
                localStorage.setItem('v_cache_' + currentUser.username, JSON.stringify(window.mediaList));
                render();
            }
        });
    }

    window.logout = function() {
        if (!confirm('Log out of ' + currentUser.displayName + '?')) return;
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        currentUser = null;
        window.mediaList = [];
        document.getElementById('mainGrid').innerHTML = '';
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('loginError').textContent = '';
        closeSettings();
        pinClear();
    };

    // ── SAVE (per-user) ──────────────────────────────────────────────────────
    async function save() {
        if (!currentUser) return;
        var docId = 'user_' + currentUser.username;
        localStorage.setItem('v_cache_' + currentUser.username, JSON.stringify(window.mediaList));
        await window.fLib.setDoc(window.fLib.doc(window.db, "archives", docId), {
            pin: undefined, // don't overwrite pin
            list: window.mediaList
        }, { merge: true });
    }

    // ── SCROLL / HELPERS ─────────────────────────────────────────────────────
    var scrollArea = document.getElementById('mainScroll');
    var scrollBtn  = document.getElementById('scrollTopBtn');

    scrollArea.onscroll = function() {
        scrollBtn.classList.toggle('visible', scrollArea.scrollTop > 300);
        snapClose(openCardIdx);
    };

    function scrollToTop() { scrollArea.scrollTo({ top: 0, behavior: 'smooth' }); }

    function snapClose(idx) {
        if (idx === null) return;
        var card = document.getElementById('card-' + idx);
        if (card) { card.classList.remove('dragging'); card.style.transform = 'translateX(0)'; }
        openCardIdx = null;
    }

    function closeAllCards(exceptIdx) {
        if (openCardIdx !== null && openCardIdx !== exceptIdx) snapClose(openCardIdx);
    }

    // ── RENDER ───────────────────────────────────────────────────────────────
    function render() {
        if (isSearch) return;
        var grid  = document.getElementById('mainGrid');
        var query = document.getElementById('filterInput').value.toLowerCase();
        var sort  = document.getElementById('sortPicker').value;
        grid.innerHTML = '';
        openCardIdx = null;

        var filtered = window.mediaList.map(function(item, idx) { return { item: item, idx: idx }; }).filter(function(e) {
            return (currentFilter === 'all' || e.item.status === currentFilter) && e.item.name.toLowerCase().includes(query);
        });

        filtered.sort(function(a, b) {
            if (sort === 'alpha') return a.item.name.localeCompare(b.item.name);
            if (sort === 'year')  return (b.item.year || 0) - (a.item.year || 0);
            if (sort === 'type')  return (a.item.type || '').localeCompare(b.item.type || '');
            return a.idx - b.idx;
        });

        filtered.forEach(function(e) {
            var item = e.item, idx = e.idx;
            var wrapper = document.createElement('div');
            wrapper.className = 'swipe-wrapper';

            var statusColor = item.status === 'watching' ? '#ffcc00' : item.status === 'pulse' ? '#78a9ff' : '#4caf50';

            var progressBar = '';
            if (item.type === 'tv' && item.episodeProgress && item.totalEpisodes) {
                var watched = Object.keys(item.episodeProgress).filter(function(k){ return item.episodeProgress[k]; }).length;
                var pct = Math.round((watched / item.totalEpisodes) * 100);
                progressBar = '<div class="card-progress"><div class="card-progress-fill" style="width:' + pct + '%"></div></div>';
            }

            wrapper.innerHTML =
                '<div class="action-tray">' +
                    '<div class="tray-grid">' +
                        '<button class="tray-btn" style="background:#ff4444;color:#000;" onclick="trayAction(' + idx + ',\'delete\')">' +
                            '<div class="tray-icon" style="-webkit-mask-image:url(\'https://api.iconify.design/ph:trash-bold.svg\');mask-image:url(\'https://api.iconify.design/ph:trash-bold.svg\');background:#000;"></div>DEL' +
                        '</button>' +
                        '<button class="tray-btn" style="background:#ffcc00;color:#000;" onclick="trayAction(' + idx + ',\'watching\')">' +
                            '<div class="tray-icon" style="-webkit-mask-image:url(\'https://api.iconify.design/ph:bookmark-bold.svg\');mask-image:url(\'https://api.iconify.design/ph:bookmark-bold.svg\');background:#000;"></div>WATCH' +
                        '</button>' +
                        '<button class="tray-btn" style="background:#78a9ff;color:#000;" onclick="trayAction(' + idx + ',\'pulse\')">' +
                            '<div class="tray-icon" style="-webkit-mask-image:url(\'https://api.iconify.design/ph:activity-bold.svg\');mask-image:url(\'https://api.iconify.design/ph:activity-bold.svg\');background:#000;"></div>PULSE' +
                        '</button>' +
                        '<button class="tray-btn" style="background:#4caf50;color:#000;" onclick="trayAction(' + idx + ',\'watched\')">' +
                            '<div class="tray-icon" style="-webkit-mask-image:url(\'https://api.iconify.design/ph:check-bold.svg\');mask-image:url(\'https://api.iconify.design/ph:check-bold.svg\');background:#000;"></div>DONE' +
                        '</button>' +
                    '</div>' +
                '</div>' +
                '<div class="item-card" id="card-' + idx + '">' +
                    '<div class="status-badge" style="color:' + statusColor + ';background:currentColor"></div>' +
                    '<img class="poster" src="' + item.poster + '">' +
                    progressBar +
                '</div>';

            grid.appendChild(wrapper);
        });
    }

    // ── DELEGATED SWIPE ENGINE ────────────────────────────────────────────────
    (function() {
        var startX = 0, startY = 0, currentX = 0, totalDY = 0;
        var isDragging = false, isHorizontal = null;
        var activeCard = null, activeIdx = null, trayOpenX = 0;
        var OPEN_THRESHOLD  = 80;
        var CLOSE_THRESHOLD = 10;

        function hitCard(e) {
            var el   = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
            var card = el && el.closest('.item-card');
            if (!card) return null;
            var m = card.id.match(/card-(\d+)/);
            return m ? { card: card, idx: parseInt(m[1]) } : null;
        }

        scrollArea.addEventListener('touchstart', function(e) {
            var hit = hitCard(e);
            if (!hit) return;
            activeCard = hit.card;
            activeIdx  = hit.idx;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            currentX = 0; totalDY = 0;
            isDragging = false; isHorizontal = null;
            trayOpenX = -activeCard.closest('.swipe-wrapper').offsetWidth;
            activeCard.classList.add('dragging');
        }, { passive: true });

        scrollArea.addEventListener('touchmove', function(e) {
            if (!activeCard) return;
            var dx = e.touches[0].clientX - startX;
            var dy = e.touches[0].clientY - startY;
            totalDY = Math.max(totalDY, Math.abs(dy));

            if (isHorizontal === null && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                isHorizontal = Math.abs(dx) > Math.abs(dy);
            }
            if (!isHorizontal) return;

            e.preventDefault();
            isDragging = true;
            currentX = dx;

            var x = currentX;
            if (x > 0) x = Math.pow(x, 0.7);
            if (x < trayOpenX) x = trayOpenX - Math.pow(Math.abs(x - trayOpenX), 0.7);
            activeCard.style.transform = 'translateX(' + x + 'px)';
        }, { passive: false });

        scrollArea.addEventListener('touchend', function() {
            if (!activeCard) return;
            activeCard.classList.remove('dragging');

            if (!isDragging) {
                if (Math.abs(currentX) + totalDY <= 10) {
                    if (openCardIdx === activeIdx) {
                        snapClose(activeIdx);
                    } else {
                        openDetail(activeIdx);
                    }
                }
                activeCard = null; activeIdx = null;
                return;
            }

            var wasOpen = openCardIdx === activeIdx;
            if (wasOpen) {
                if (currentX > CLOSE_THRESHOLD) {
                    snapClose(activeIdx);
                } else {
                    activeCard.style.transform = 'translateX(' + trayOpenX + 'px)';
                }
            } else {
                if (currentX < -OPEN_THRESHOLD) {
                    closeAllCards(activeIdx);
                    activeCard.style.transform = 'translateX(' + trayOpenX + 'px)';
                    openCardIdx = activeIdx;
                } else {
                    snapClose(activeIdx);
                }
            }

            activeCard = null; activeIdx = null;
        }, { passive: true });
    })();

    // ── TRAY ACTIONS ─────────────────────────────────────────────────────────
    window.trayAction = async function(idx, action) {
        snapClose(idx);
        if (action === 'delete') {
            if (confirm('Erase from Vault?')) {
                window.mediaList.splice(idx, 1);
                await save(); render();
            }
        } else {
            window.mediaList[idx].status = action;
            await save(); render();
        }
    };

    // ── DETAIL PAGE ───────────────────────────────────────────────────────────
    async function openDetail(idx) {
        currentDetailIdx = idx;
        currentSeason = 1;
        var item = window.mediaList[idx];
        var page = document.getElementById('detailPage');

        document.getElementById('detailScroll').scrollTop = 0;
        document.getElementById('detailPoster').src = item.poster;
        document.getElementById('detailTitle').textContent = item.name;
        document.getElementById('detailMeta').textContent = 'LOADING...';
        document.getElementById('detailOverview').textContent = '';
        document.getElementById('detailActions').innerHTML = '';
        document.getElementById('detailProviders').innerHTML = '';
        document.getElementById('detailTracker').innerHTML = '<div style="text-align:center;padding:30px;opacity:0.4;font-size:13px;letter-spacing:2px;">LOADING INTEL...</div>';

        page.classList.add('open');

        try {
            var res  = await fetch('https://api.themoviedb.org/3/' + item.type + '/' + item.tmdbId + '?api_key=' + tmdbKey + '&append_to_response=videos,external_ids');
            var data = await res.json();
            var trailer = data.videos && data.videos.results.find(function(v){ return v.type === 'Trailer' && v.site === 'YouTube'; });
            var imdbId  = data.imdb_id || (data.external_ids && data.external_ids.imdb_id);

            var year = item.type === 'movie' ? (data.release_date || '').slice(0,4) : (data.first_air_date || '').slice(0,4);
            var typeLabel = item.type === 'movie' ? 'MOVIE' : 'TV SERIES';

            document.getElementById('detailMeta').textContent = typeLabel + (year ? '  ·  ' + year : '');
            document.getElementById('detailOverview').textContent = data.overview || '';

            var actionsHTML = '';
            if (trailer) actionsHTML += '<a href="https://www.youtube.com/watch?v=' + trailer.key + '" target="_blank" style="background:#ff4444;color:#fff;">▶ TRAILER</a>';
            actionsHTML += '<a href="https://imdb.com/title/' + (imdbId || 'find?q=' + item.name) + '" target="_blank" style="background:#f5c518;color:#000;">IMDb</a>';
            document.getElementById('detailActions').innerHTML = actionsHTML;

            // Fetch streaming providers
            loadProviders(item.type, item.tmdbId);

            if (item.type === 'movie') {
                renderMovieTracker(idx, item);
            } else {
                var seasons = (data.seasons || []).filter(function(s){ return s.season_number > 0; });
                window.mediaList[idx]._seasons = seasons;
                renderTVTracker(idx, item, seasons, data);
            }
        } catch(err) {
            document.getElementById('detailTracker').innerHTML = '<div style="text-align:center;padding:20px;opacity:0.4;font-size:12px;">COULD NOT LOAD DATA</div>';
        }
    }

    function closeDetail() {
        document.getElementById('detailPage').classList.remove('open');
        currentDetailIdx = null;
        render();
    }

    async function loadProviders(type, tmdbId) {
        var container = document.getElementById('detailProviders');
        try {
            var res  = await fetch('https://api.themoviedb.org/3/' + type + '/' + tmdbId + '/watch/providers?api_key=' + tmdbKey);
            var data = await res.json();
            var region = data.results && data.results.AU;
            if (!region) {
                container.innerHTML = '';
                return;
            }

            var html = '<div class="provider-section"><div class="section-title">WHERE TO WATCH</div>';

            var sections = [
                { key: 'flatrate', label: 'Stream' },
                { key: 'rent',     label: 'Rent' },
                { key: 'buy',      label: 'Buy' }
            ];

            var hasAny = false;
            sections.forEach(function(s) {
                var providers = region[s.key];
                if (providers && providers.length) {
                    hasAny = true;
                    html += '<div class="provider-label">' + s.label + '</div><div class="provider-row">';
                    providers.forEach(function(p) {
                        html += '<img class="provider-logo" src="https://image.tmdb.org/t/p/w92' + p.logo_path + '" alt="' + p.provider_name + '" title="' + p.provider_name + '">';
                    });
                    html += '</div>';
                }
            });

            html += '</div>';
            container.innerHTML = hasAny ? html : '';
        } catch(err) {
            container.innerHTML = '';
        }
    }

    function renderMovieTracker(idx, item) {
        var watched = item.status === 'watched';
        document.getElementById('detailTracker').innerHTML =
            '<button class="movie-watched-btn" onclick="toggleMovieWatched(' + idx + ')" style="background:' + (watched ? 'var(--glow)' : 'rgba(255,255,255,0.07)') + ';color:' + (watched ? '#05162d' : '#fff') + ';border:1px solid ' + (watched ? 'var(--glow)' : 'var(--border)') + ';">' +
                (watched ? '✓  WATCHED' : 'MARK AS WATCHED') +
            '</button>';
    }

    window.toggleMovieWatched = async function(idx) {
        var item = window.mediaList[idx];
        item.status = item.status === 'watched' ? 'watching' : 'watched';
        await save();
        renderMovieTracker(idx, item);
    };

    function renderTVTracker(idx, item, seasons) {
        if (!seasons || seasons.length === 0) {
            document.getElementById('detailTracker').innerHTML = '<div style="opacity:0.4;font-size:12px;text-align:center;padding:20px;">NO SEASON DATA</div>';
            return;
        }

        var tabsHTML = '<div class="section-title">EPISODES</div><div class="season-tabs" id="seasonTabs">';
        seasons.forEach(function(s) {
            tabsHTML += '<button class="season-tab' + (s.season_number === currentSeason ? ' active' : '') + '" onclick="selectSeason(' + idx + ',' + s.season_number + ',' + seasons.length + ')">' +
                'S' + s.season_number + '</button>';
        });
        tabsHTML += '</div><div id="episodeList"><div style="text-align:center;padding:20px;opacity:0.4;font-size:12px;letter-spacing:2px;">LOADING...</div></div>';

        document.getElementById('detailTracker').innerHTML = tabsHTML;
        loadSeason(idx, currentSeason);
    }

    window.selectSeason = function(idx, seasonNum) {
        currentSeason = seasonNum;
        document.querySelectorAll('.season-tab').forEach(function(tab, i) {
            tab.classList.toggle('active', i + 1 === seasonNum);
        });
        loadSeason(idx, seasonNum);
    };

    async function loadSeason(idx, seasonNum) {
        var item = window.mediaList[idx];
        var epList = document.getElementById('episodeList');
        if (!epList) return;
        epList.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.4;font-size:12px;letter-spacing:2px;">LOADING...</div>';

        try {
            var res  = await fetch('https://api.themoviedb.org/3/tv/' + item.tmdbId + '/season/' + seasonNum + '?api_key=' + tmdbKey);
            var data = await res.json();
            var episodes = data.episodes || [];

            if (!item.episodeProgress) item.episodeProgress = {};

            var watched = episodes.filter(function(ep){
                return item.episodeProgress['s' + seasonNum + 'e' + ep.episode_number];
            }).length;

            var html = '<div class="ep-season-progress">' + watched + ' / ' + episodes.length + ' watched</div><div class="episode-list">';
            episodes.forEach(function(ep) {
                var key = 's' + seasonNum + 'e' + ep.episode_number;
                var isWatched = !!item.episodeProgress[key];
                html +=
                    '<div class="episode-row' + (isWatched ? ' watched' : '') + '" onclick="toggleEpisode(' + idx + ',' + seasonNum + ',' + ep.episode_number + ')">' +
                        '<div class="ep-check"><div class="ep-check-icon"></div></div>' +
                        '<div class="ep-info">' +
                            '<div class="ep-num">S' + seasonNum + ' · E' + ep.episode_number + '</div>' +
                            '<div class="ep-name">' + (ep.name || 'Episode ' + ep.episode_number) + '</div>' +
                        '</div>' +
                    '</div>';
            });
            html += '</div>';
            epList.innerHTML = html;
        } catch(err) {
            epList.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.4;font-size:12px;">COULD NOT LOAD EPISODES</div>';
        }
    }

    window.toggleEpisode = async function(idx, seasonNum, epNum) {
        var item = window.mediaList[idx];
        if (!item.episodeProgress) item.episodeProgress = {};
        var key = 's' + seasonNum + 'e' + epNum;
        item.episodeProgress[key] = !item.episodeProgress[key];

        var knownEps = Object.keys(item.episodeProgress).length;
        if (!item.totalEpisodes || item.totalEpisodes < knownEps) item.totalEpisodes = knownEps;

        await save();

        var rows = document.querySelectorAll('.episode-row');
        var rowIdx = epNum - 1;
        if (rows[rowIdx]) rows[rowIdx].classList.toggle('watched', item.episodeProgress[key]);

        var episodes = document.querySelectorAll('.episode-row');
        var watchedCount = Array.from(episodes).filter(function(r){ return r.classList.contains('watched'); }).length;
        var progEl = document.querySelector('.ep-season-progress');
        if (progEl) progEl.textContent = watchedCount + ' / ' + episodes.length + ' watched';
    };

    // ── SEARCH ───────────────────────────────────────────────────────────────
    async function performSearch() {
        var q    = document.getElementById('showInput').value;
        var res  = await fetch('https://api.themoviedb.org/3/search/multi?api_key=' + tmdbKey + '&query=' + encodeURIComponent(q));
        var data = await res.json();
        isSearch = true;
        document.getElementById('backBtn').style.display = 'block';
        var grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.results.filter(function(i){ return i.poster_path; }).forEach(function(item) {
            var div = document.createElement('div');
            div.className = 'item-card';
            var alreadyInVault = window.mediaList.some(function(m){ return m.tmdbId === item.id; });
            var btnStyle = alreadyInVault ? 'width:100%;border-radius:0;background:#4caf50;color:#fff;' : 'width:100%;border-radius:0;';
            var btnText = alreadyInVault ? '✓ IN VAULT' : 'ADD';
            var btnClick = alreadyInVault ? '' : ' onclick=\'addItem(' + JSON.stringify(item).replace(/'/g, "") + ')\'';
            div.innerHTML = '<img class="poster" src="https://image.tmdb.org/t/p/w500' + item.poster_path + '"><div style="padding:10px;font-size:12px;text-align:center;">' + (item.title || item.name) + '</div><button id="add-btn-' + item.id + '" class="btn-main" style="' + btnStyle + '"' + btnClick + (alreadyInVault ? ' disabled' : '') + '>' + btnText + '</button>';
            grid.appendChild(div);
        });
    }

    var GENRE_MAP = {
        28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',
        99:'Documentary',18:'Drama',10751:'Family',14:'Fantasy',36:'History',
        27:'Horror',10402:'Music',9648:'Mystery',10749:'Romance',878:'Sci-Fi',
        53:'Thriller',10752:'War',37:'Western',10759:'Action & Adventure',
        10762:'Kids',10763:'News',10764:'Reality',10765:'Sci-Fi & Fantasy',
        10768:'War & Politics'
    };

    window.addItem = async function(item) {
        if (window.mediaList.some(function(m){ return m.tmdbId === item.id; })) return;
        var year = item.release_date ? parseInt(item.release_date) : item.first_air_date ? parseInt(item.first_air_date) : 0;
        var genres = (item.genre_ids || []).map(function(id){ return GENRE_MAP[id]; }).filter(Boolean);
        window.mediaList.unshift({
            name: item.title || item.name,
            status: 'watching',
            poster: 'https://image.tmdb.org/t/p/w500' + item.poster_path,
            type: item.media_type,
            tmdbId: item.id,
            year: year,
            genres: genres,
            episodeProgress: {},
            totalEpisodes: 0
        });
        await save();
        var btn = document.getElementById('add-btn-' + item.id);
        if (btn) {
            btn.textContent = '✓ ADDED';
            btn.style.background = '#4caf50';
            btn.style.color = '#fff';
            btn.disabled = true;
            btn.onclick = null;
        }
    };

    // ── SETTINGS / STATS ─────────────────────────────────────────────────────
    function openSettings() {
        var page = document.getElementById('settingsPage');
        page.classList.add('open');

        document.getElementById('tmdbKeyDisplay').textContent = tmdbKey ? tmdbKey.slice(0,4) + '••••' + tmdbKey.slice(-4) : 'NOT SET';
        document.getElementById('settingsUserDisplay').textContent = currentUser ? currentUser.displayName : '—';
        document.getElementById('settingsUsernameDisplay').textContent = currentUser ? '@' + currentUser.username : '—';

        var list = window.mediaList;
        var total = list.length;
        var movies = list.filter(function(i){ return i.type === 'movie'; }).length;
        var shows  = list.filter(function(i){ return i.type === 'tv'; }).length;

        var epsWatched = 0;
        list.forEach(function(i) {
            if (i.episodeProgress) epsWatched += Object.values(i.episodeProgress).filter(Boolean).length;
        });

        var watching = list.filter(function(i){ return i.status === 'watching'; }).length;
        var pulse    = list.filter(function(i){ return i.status === 'pulse'; }).length;
        var watched  = list.filter(function(i){ return i.status === 'watched'; }).length;

        document.getElementById('statGrid').innerHTML =
            statCard(total, 'Total Titles') + statCard(movies, 'Movies') + statCard(shows, 'TV Shows') + statCard(epsWatched, 'Episodes Watched');

        var maxStatus = Math.max(watching, pulse, watched, 1);
        var statusData = [
            { label: 'Watchlist', count: watching, color: '#ffcc00' },
            { label: 'Watching',  count: pulse,    color: '#78a9ff' },
            { label: 'Watched',   count: watched,  color: '#4caf50' }
        ];
        document.getElementById('statusBars').innerHTML = statusData.map(function(s) {
            return '<div class="status-bar-row"><div class="status-bar-label"><span>' + s.label + '</span><span>' + s.count + '</span></div><div class="status-bar-track"><div class="status-bar-fill" style="width:' + Math.round((s.count/maxStatus)*100) + '%;background:' + s.color + ';"></div></div></div>';
        }).join('');

        var genreCounts = {};
        list.forEach(function(i) {
            if (i.genres) i.genres.forEach(function(g) { genreCounts[g] = (genreCounts[g] || 0) + 1; });
        });
        var genreEntries = Object.entries(genreCounts).sort(function(a,b){ return b[1]-a[1]; }).slice(0,8);
        var maxGenre = genreEntries.length ? genreEntries[0][1] : 1;

        document.getElementById('genreChart').innerHTML = genreEntries.length
            ? genreEntries.map(function(g) {
                return '<div class="genre-row"><div class="genre-name">' + g[0] + '</div><div class="genre-track"><div class="genre-fill" style="width:' + Math.round((g[1]/maxGenre)*100) + '%"></div></div><div class="genre-count">' + g[1] + '</div></div>';
            }).join('')
            : '<div style="opacity:0.3;font-size:12px;padding:10px 0;">Genres will appear as you add new titles</div>';
    }

    function statCard(val, label) {
        return '<div class="stat-card"><div class="stat-value">' + val + '</div><div class="stat-label">' + label + '</div></div>';
    }

    function closeSettings() { document.getElementById('settingsPage').classList.remove('open'); }

    async function changeTmdbKey() {
        var k = prompt("TMDB Key:", tmdbKey);
        if (k) {
            tmdbKey = k;
            localStorage.setItem('tmdbKey', k);
            // Save to Firebase so it persists across devices/updates
            if (currentUser) {
                var docId = 'user_' + currentUser.username;
                await window.fLib.setDoc(window.fLib.doc(window.db, "archives", docId), { tmdbKey: k }, { merge: true });
            }
            document.getElementById('tmdbKeyDisplay').textContent = k.slice(0,4) + '••••' + k.slice(-4);
        }
    }

    function exitSearch() { isSearch = false; document.getElementById('backBtn').style.display = 'none'; render(); }

    function setFilter(f, btn) {
        currentFilter = f;
        document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        render();
    }

    function randomize() {
        var available = window.mediaList.filter(function(item){ return currentFilter === 'all' || item.status === currentFilter; });
        if (available.length) openDetail(window.mediaList.indexOf(available[Math.floor(Math.random() * available.length)]));
    }
</script>
</body>
</html>
