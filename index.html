<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Vault</title>
    <style>
        :root {
            --glass: rgba(10, 15, 25, 0.98);
            --border: rgba(120, 169, 255, 0.2);
            --glow: #78a9ff;
            --accent: #ffcc00; 
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --glide: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed;
            font-family: -apple-system, system-ui, sans-serif;
            background: #050a15 url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2022&auto=format&fit=crop') center/cover fixed;
            color: #fff;
        }

        .app-container {
            height: 100%; display: flex; flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: calc(75px + var(--safe-bottom));
        }

        .scroll-view { flex: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }

        .media-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px; width: 100%;
        }

        .header-card { background: var(--glass); backdrop-filter: blur(40px); border: 1px solid var(--border); border-radius: 28px; padding: 20px; margin-bottom: 20px; }

        /* Swipe container */
        .swipe-wrapper {
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            background: #070d1a;
            touch-action: pan-y; 
        }

        .action-tray {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            background: #070d1a;
        }

        .tray-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }

        .tray-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            gap: 3px;
            transition: transform 0.15s var(--spring), filter 0.15s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .tray-btn:active { transform: scale(0.88); filter: brightness(1.2); }

        .tray-icon {
            width: 18px;
            height: 18px;
            background: currentColor;
            mask-size: contain;
            mask-repeat: no-repeat;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
        }

        .item-card {
            position: relative;
            z-index: 2;
            background: #000;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--border);
            /* Default: smooth spring snap-back */
            transition: transform 0.45s var(--spring);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            will-change: transform; 
        }

        /* While actively dragging, no transition */
        .item-card.dragging {
            transition: none !important;
        }
        
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; pointer-events: none; }
        
        .status-badge {
            position: absolute; top: 12px; right: 12px;
            width: 10px; height: 10px; border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(75px + var(--safe-bottom));
            background: rgba(0,0,0,0.96); backdrop-filter: blur(40px); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; padding-bottom: var(--safe-bottom); z-index: 5000;
        }
        .nav-item { background: none; border: none; color: rgba(255,255,255,0.25); display: flex; flex-direction: column; align-items: center; font-size: 10px; flex: 1; }
        .nav-item.active { color: var(--glow); }
        .nav-icon { width: 24px; height: 24px; background: currentColor; mask-size: contain; mask-repeat: no-repeat; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; margin-bottom: 5px; }

        .btn-main { background: var(--glow); color: #05162d; border: none; padding: 12px 20px; border-radius: 16px; font-weight: bold; cursor: pointer; }
        .btn-rand { background: var(--accent); color: #000; border: none; width: 100%; margin-top: 12px; padding: 14px; font-size: 12px; font-weight: 900; letter-spacing: 2px; border-radius: 16px; }
        
        input { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 16px; font-size: 16px !important; }

        #scrollTopBtn {
            position: fixed; bottom: calc(90px + var(--safe-bottom)); right: 20px;
            width: 58px; height: 58px; background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px); border: 1px solid rgba(120, 169, 255, 0.4);
            z-index: 4000; opacity: 0; pointer-events: none; transition: all 0.5s var(--glide);
            transform: translateY(30px) scale(0.7); border-radius: 20px; display: flex; align-items: center; justify-content: center;
        }
        .arrow-shape { width: 32px; height: 32px; background-color: var(--glow); -webkit-mask: url('https://api.iconify.design/ph:caret-double-up-bold.svg') no-repeat center; mask-size: contain; }
        #scrollTopBtn.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            z-index: 9000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.5s var(--glide);
        }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { width: 92%; max-width: 400px; background: #0a111f; border-radius: 35px; padding: 30px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="scroll-view" id="mainScroll">
        <div class="header-card">
            <h2 style="margin: 0 0 15px 0; font-size: 1.3em; letter-spacing: 5px; font-weight: 300; text-align: center; opacity: 0.8;">THE VAULT</h2>
            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <input type="text" id="showInput" placeholder="Initialize..." onkeydown="if(event.key==='Enter') performSearch()">
                <button class="btn-main" onclick="performSearch()">ENGAGE</button>
            </div>
            <input type="text" id="filterInput" style="width:100%; height:45px;" placeholder="Search Archive..." onkeyup="render()">
            <button class="btn-rand" onclick="randomize()">RANDOMIZE MISSION</button>
        </div>
        <button id="backBtn" class="btn-main" style="display:none; width:100%; margin-bottom:20px; padding:18px;" onclick="exitSearch()">← BACK TO VAULT</button>
        <div class="media-grid" id="mainGrid"></div>
    </div>
</div>

<div id="scrollTopBtn" onclick="scrollToTop()"><div class="arrow-shape"></div></div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="setFilter('all', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:stack-bold.svg')"></div>Vault</button>
    <button class="nav-item" onclick="setFilter('watching', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:clock-bold.svg')"></div>Watching</button>
    <button class="nav-item" onclick="setFilter('pulse', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:activity-bold.svg')"></div>Pulse</button>
    <button class="nav-item" onclick="openSettings()"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:gear-bold.svg')"></div>System</button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalBody"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const config = {
        apiKey: "AIzaSyAf9NqhQ8iGoVWeCCCoZChF1RKY-HER678",
        authDomain: "the-vault-41656.firebaseapp.com",
        projectId: "the-vault-41656",
        storageBucket: "the-vault-41656.firebasestorage.app",
        messagingSenderId: "8990033543",
        appId: "1:8990033543:web:1579e3987a69f9ffcd1a22"
    };

    const app = initializeApp(config);
    const db = getFirestore(app);
    window.db = db; window.fLib = { doc, setDoc, onSnapshot };
    
    const cache = localStorage.getItem('v_cache');
    if(cache) { window.mediaList = JSON.parse(cache); render(); }

    window.fLib.onSnapshot(window.fLib.doc(db, "archives", "user_bailey"), (doc) => {
        if(doc.exists()) {
            window.mediaList = doc.data().list || [];
            localStorage.setItem('v_cache', JSON.stringify(window.mediaList));
            render();
        }
    });
</script>

<script>
    window.mediaList = [];
    let tmdbKey = localStorage.getItem('tmdbKey') || '';
    let currentFilter = 'all';
    let isSearch = false;

    // Track which card index is currently open (tray revealed)
    let openCardIdx = null;

    const scrollArea = document.getElementById('mainScroll');
    const scrollBtn = document.getElementById('scrollTopBtn');
    scrollArea.onscroll = () => {
        scrollBtn.classList.toggle('visible', scrollArea.scrollTop > 300);
        // Snap back any open card when the user scrolls
        snapClose(openCardIdx);
    };

    function scrollToTop() { scrollArea.scrollTo({ top: 0, behavior: 'smooth' }); }

    // ─── Close a card by index ───────────────────────────────────────────────
    function snapClose(idx) {
        if (idx === null) return;
        const card = document.getElementById(`card-${idx}`);
        if (card) {
            card.classList.remove('dragging');
            card.style.transform = 'translateX(0)';
        }
        openCardIdx = null;
    }

    // ─── Close all open cards (call before opening a new one) ────────────────
    function closeAllCards(exceptIdx) {
        if (openCardIdx !== null && openCardIdx !== exceptIdx) {
            snapClose(openCardIdx);
        }
    }

    // ─── Tap on scroll backdrop closes open card ─────────────────────────────
    document.getElementById('mainScroll').addEventListener('click', (e) => {
        if (openCardIdx !== null && !e.target.closest('.swipe-wrapper')) {
            snapClose(openCardIdx);
        }
    }, true);

    function render() {
        if(isSearch) return;
        const grid = document.getElementById('mainGrid');
        const query = document.getElementById('filterInput').value.toLowerCase();
        grid.innerHTML = '';
        openCardIdx = null;
        
        window.mediaList.forEach((item, idx) => {
            if((currentFilter === 'all' || item.status === currentFilter) && item.name.toLowerCase().includes(query)) {
                const wrapper = document.createElement('div');
                wrapper.className = 'swipe-wrapper';
                
                const statusColor = item.status === 'watching' ? '#ffcc00' : (item.status === 'pulse' ? '#78a9ff' : '#4caf50');
                
                wrapper.innerHTML = `
                    <div class="action-tray">
                        <div class="tray-grid">
                            <button class="tray-btn" style="background:#ff4444;" onclick="trayAction(${idx}, 'delete')">
                                <div class="tray-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:trash-bold.svg'); mask-image:url('https://api.iconify.design/ph:trash-bold.svg'); background:#fff;"></div>
                                DEL
                            </button>
                            <button class="tray-btn" style="background:#ffcc00;" onclick="trayAction(${idx}, 'watching')">
                                <div class="tray-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:clock-bold.svg'); mask-image:url('https://api.iconify.design/ph:clock-bold.svg'); background:#000;"></div>
                                <span style="color:#000">WATCH</span>
                            </button>
                            <button class="tray-btn" style="background:#78a9ff;" onclick="trayAction(${idx}, 'pulse')">
                                <div class="tray-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:activity-bold.svg'); mask-image:url('https://api.iconify.design/ph:activity-bold.svg'); background:#000;"></div>
                                <span style="color:#000">PULSE</span>
                            </button>
                            <button class="tray-btn" style="background:#4caf50;" onclick="trayAction(${idx}, 'watched')">
                                <div class="tray-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:check-bold.svg'); mask-image:url('https://api.iconify.design/ph:check-bold.svg'); background:#fff;"></div>
                                DONE
                            </button>
                        </div>
                    </div>
                    <div class="item-card" id="card-${idx}">
                        <div class="status-badge" style="color:${statusColor}; background:currentColor"></div>
                        <img class="poster" src="${item.poster}">
                    </div>`;

                // Attach swipe listeners after inserting
                grid.appendChild(wrapper);
                attachSwipe(wrapper.querySelector('.item-card'), idx);
            }
        });
    }

    // ─── SWIPE ENGINE ────────────────────────────────────────────────────────
    function attachSwipe(card, idx) {
        let startX = 0, startY = 0, currentX = 0, totalDY = 0;
        let isDragging = false, isHorizontal = null;
        const OPEN_THRESHOLD  = 80;   // px to commit to open
        const CLOSE_THRESHOLD = 40;   // px to commit to close when open
        const TRAY_OPEN_X     = -(card.offsetWidth * 0.6); // slide enough to reveal centred 2x2 grid

        card.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            currentX = 0;
            totalDY = 0;
            isDragging = false;
            isHorizontal = null;
            card.classList.add('dragging');
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
            window._lastTouchY = e.touches[0].clientY;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            totalDY = Math.max(totalDY, Math.abs(dy));

            // Determine axis on first meaningful move
            if (isHorizontal === null && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                isHorizontal = Math.abs(dx) > Math.abs(dy);
            }

            if (!isHorizontal) return; // vertical scroll — bail

            e.preventDefault(); // block page scroll during horizontal swipe
            isDragging = true;
            currentX = dx;

            // Rubber-band effect at edges
            let x = currentX;
            if (x > 0) x = Math.pow(x, 0.7);           // right rubber band
            if (x < TRAY_OPEN_X) x = TRAY_OPEN_X - Math.pow(Math.abs(x - TRAY_OPEN_X), 0.7);

            card.style.transform = `translateX(${x}px)`;
        }, { passive: false });

        card.addEventListener('touchend', () => {
            card.classList.remove('dragging');

            if (!isDragging) {
                // Only treat as a tap if the finger barely moved vertically too
                // (guards against scroll-lift being mistaken for a tap)
                const totalMove = Math.abs(currentX) + totalDY;
                if (totalMove > 10) return; // was a scroll, not a tap

                if (openCardIdx === idx) {
                    snapClose(idx);
                } else {
                    openItem(idx);
                }
                return;
            }

            const wasOpen = openCardIdx === idx;

            if (wasOpen) {
                // Card was open — close if swiped right enough
                if (currentX > CLOSE_THRESHOLD) {
                    snapClose(idx);
                } else {
                    // Snap back to open
                    card.style.transform = `translateX(${TRAY_OPEN_X}px)`;
                }
            } else {
                // Card was closed — open if swiped left enough
                if (currentX < -OPEN_THRESHOLD) {
                    closeAllCards(idx);
                    card.style.transform = `translateX(${TRAY_OPEN_X}px)`;
                    openCardIdx = idx;
                } else {
                    snapClose(idx);
                }
            }
        }, { passive: true });
    }

    // ─── Tray button handler — always snaps card closed after action ─────────
    window.trayAction = async (idx, action) => {
        snapClose(idx);
        if (action === 'delete') {
            if (confirm('Erase from Vault?')) {
                window.mediaList.splice(idx, 1);
                await save();
                render();
            }
        } else {
            await updateStatus(idx, action);
        }
    };

    async function updateStatus(i, s) { window.mediaList[i].status = s; await save(); render(); }
    async function save() { localStorage.setItem('v_cache', JSON.stringify(window.mediaList)); await window.fLib.setDoc(window.fLib.doc(window.db, "archives", "user_bailey"), { list: window.mediaList }); }

    async function openItem(idx) {
        const item = window.mediaList[idx];
        const modal = document.getElementById('modal');
        const body = document.getElementById('modalBody');
        modal.classList.add('active');
        body.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.5;">LOADING INTEL...</div>';
        
        const res = await fetch(`https://api.themoviedb.org/3/${item.type}/${item.tmdbId}?api_key=${tmdbKey}&append_to_response=videos,external_ids`);
        const data = await res.json();
        const trailer = data.videos?.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
        const imdbId = data.imdb_id || data.external_ids?.imdb_id;

        body.innerHTML = `
            <div style="text-align:center;">
                <img src="${item.poster}" style="width:120px; border-radius:20px; margin-bottom:15px;">
                <h3 style="margin:0 0 10px 0; color:var(--glow);">${item.name}</h3>
                <p style="font-size:13px; opacity:0.7; line-height:1.5; margin-bottom:20px;">${data.overview}</p>
                <div style="display:flex; gap:10px;">
                    ${trailer ? `<a href="https://www.youtube.com/watch?v=${trailer.key}" target="_blank" class="btn-main" style="flex:1; background:#ff4444; color:#fff; text-decoration:none; display:flex; align-items:center; justify-content:center;">TRAILER</a>` : ''}
                    <a href="https://imdb.com/title/${imdbId || 'find?q='+item.name}" target="_blank" class="btn-main" style="flex:1; background:#f5c518; color:#000; text-decoration:none; display:flex; align-items:center; justify-content:center;">IMDb</a>
                </div>
            </div>`;
    }

    async function performSearch() {
        const q = document.getElementById('showInput').value;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&query=${encodeURIComponent(q)}`);
        const data = await res.json();
        isSearch = true;
        document.getElementById('backBtn').style.display = 'block';
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.results.filter(i => i.poster_path).forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<img class="poster" src="https://image.tmdb.org/t/p/w500${item.poster_path}"><div style="padding:10px; font-size:12px; text-align:center;">${item.title || item.name}</div><button class="btn-main" style="width:100%; border-radius:0;" onclick='addItem(${JSON.stringify(item).replace(/'/g, "")})'>ADD</button>`;
            grid.appendChild(div);
        });
    }

    window.addItem = (item) => {
        window.mediaList.unshift({ name: item.title || item.name, status: 'watching', poster: `https://image.tmdb.org/t/p/w500${item.poster_path}`, type: item.media_type, tmdbId: item.id });
        save(); exitSearch();
    };

    function exitSearch() { isSearch = false; document.getElementById('backBtn').style.display='none'; render(); }
    function setFilter(f, btn) { currentFilter = f; document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }
    function openSettings() { const k = prompt("TMDB Key:", tmdbKey); if(k) { tmdbKey = k; localStorage.setItem('tmdbKey', k); location.reload(); } }
    function randomize() { 
        const available = window.mediaList.filter(item => currentFilter === 'all' || item.status === currentFilter);
        if(available.length) openItem(window.mediaList.indexOf(available[Math.floor(Math.random() * available.length)]));
    }
</script>
</body>
</html>
