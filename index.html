<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Vault</title>
    <style>
        :root {
            --glass: rgba(10, 15, 25, 0.96);
            --border: rgba(120, 169, 255, 0.3);
            --glow: #78a9ff;
            --accent: #ffcc00; 
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --bezier: cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy "Pop" Curve */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed;
            font-family: -apple-system, system-ui, sans-serif;
            background: #050a15 url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2022&auto=format&fit=crop') center/cover fixed;
            color: #fff;
        }

        .app-container {
            height: 100%; display: flex; flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: calc(75px + var(--safe-bottom));
        }

        .scroll-view {
            flex: 1; overflow-y: auto; padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        /* Responsive Grid */
        .media-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; width: 100%;
        }

        @media (min-width: 800px) {
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
            .app-container { padding-bottom: 20px; }
            .bottom-nav { width: 450px; left: 50% !important; transform: translateX(-50%); border-radius: 40px; bottom: 25px !important; }
        }

        .card {
            background: var(--glass); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 20px; margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        input { 
            flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border); 
            color: #fff; padding: 14px; border-radius: 14px; font-size: 16px !important;
            transition: all 0.3s ease;
        }

        .btn-main { 
            background: var(--glow); color: #05162d; border: none; 
            padding: 12px 20px; border-radius: 14px; font-weight: bold; 
            cursor: pointer; transition: all 0.2s ease;
            font-size: 14px;
        }
        .btn-main:active { transform: scale(0.95); opacity: 0.9; }

        /* Item Cards */
        .item-card {
            background: rgba(255,255,255,0.03); border-radius: 20px;
            padding: 10px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 10px;
            transition: transform 0.3s var(--bezier);
        }
        .item-card:active { transform: scale(0.94); }
        
        .poster { width: 100%; aspect-ratio: 2/3; border-radius: 14px; object-fit: cover; background: #111; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .title { font-size: 0.85em; font-weight: 600; text-align: center; min-height: 2.4em; color: rgba(255,255,255,0.9); }

        .btn-status { 
            flex: 1; font-size: 10px; padding: 10px 0; border-radius: 9px; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: rgba(255,255,255,0.5);
            text-transform: uppercase; font-weight: 800;
        }
        .active-watch { border-color: var(--accent); color: var(--accent); background: rgba(255,204,0,0.15); }
        .active-pulse { border-color: var(--glow); color: var(--glow); background: rgba(120,169,255,0.15); }
        .active-done { border-color: #4caf50; color: #4caf50; background: rgba(76,175,80,0.15); }

        /* Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(75px + var(--safe-bottom));
            background: rgba(0,0,0,0.95); backdrop-filter: blur(35px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: var(--safe-bottom); z-index: 5000;
        }
        .nav-item { 
            background: none; border: none; color: rgba(255,255,255,0.35); 
            display: flex; flex-direction: column; align-items: center; font-size: 10px; flex: 1;
        }
        .nav-item.active { color: var(--glow); }
        .nav-icon { width: 24px; height: 24px; background: currentColor; mask-size: contain; mask-repeat: no-repeat; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; margin-bottom: 5px; }

        /* MODAL POLISH - Smooth "Pop" */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 9000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal.active { display: flex; opacity: 1; }
        
        .modal-content { 
            width: 90%; max-width: 450px; max-height: 80vh; background: #0a111f; 
            border: 1px solid var(--border); border-radius: 28px;
            padding: 25px; overflow-y: auto; 
            transform: scale(0.8) translate3d(0, 50px, 0); 
            transition: transform 0.4s var(--bezier);
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
        }
        .modal.active .modal-content { transform: scale(1) translate3d(0, 0, 0); }

        .modal-header { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 20px; text-align: center; }
        .modal-poster { width: 140px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-info h3 { margin: 0; color: var(--glow); font-size: 1.5em; letter-spacing: 1px; }
        .modal-info p { font-size: 0.9em; line-height: 1.6; opacity: 0.75; margin-top: 12px; }

        /* Larger Action Buttons */
        .modal-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 20px; }
        .btn-action { 
            width: 100%; padding: 16px; border-radius: 16px; border: none; 
            font-weight: 800; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; transition: 0.2s ease;
        }
        .btn-toon { background: var(--accent); color: #000; }
        .btn-delete { background: rgba(255, 68, 68, 0.2); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.4); }

        #syncStatus { position: fixed; top: calc(var(--safe-top) + 15px); left: 20px; font-size: 9px; color: var(--glow); z-index: 6000; font-weight: bold; }
    </style>
</head>
<body>

<div id="syncStatus">SYSTEM AUTHENTICATED</div>

<div class="app-container">
    <div class="scroll-view">
        <div class="card">
            <h2 id="pageTitle" style="margin: 0 0 15px 0; font-size: 1.4em; letter-spacing: 4px; font-weight: 300; text-align: center;">THE VAULT</h2>
            <div class="search-row">
                <input type="text" id="showInput" placeholder="Initialize New Entry..." onkeydown="if(event.key==='Enter') performFullSearch()">
                <button class="btn-main" onclick="performFullSearch()">ENGAGE</button>
            </div>
            <input type="text" id="filterInput" style="height:40px;" placeholder="Search Archive..." onkeyup="render()">
        </div>

        <button id="backBtn" class="btn-main" style="display:none; width:100%; margin-bottom:20px; padding:15px;" onclick="exitSearch()">← RETURN TO ARCHIVE</button>
        <div class="media-grid" id="mainGrid"></div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="setFilter('all', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:stack-bold.svg')"></div>Vault</button>
    <button class="nav-item" onclick="setFilter('watching', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:clock-bold.svg')"></div>Watch</button>
    <button class="nav-item" onclick="setFilter('pulse', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:activity-bold.svg')"></div>Pulse</button>
    <button class="nav-item" onclick="setFilter('animated', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:rocket-launch-bold.svg')"></div>Toons</button>
    <button class="nav-item" onclick="openSettings()"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:gear-bold.svg')"></div>Setup</button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalBody"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAf9NqhQ8iGoVWeCCCoZChF1RKY-HER678",
        authDomain: "the-vault-41656.firebaseapp.com",
        projectId: "the-vault-41656",
        storageBucket: "the-vault-41656.firebasestorage.app",
        messagingSenderId: "8990033543",
        appId: "1:8990033543:web:1579e3987a69f9ffcd1a22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.vaultDB = db;
    window.firestore = { doc, setDoc, onSnapshot };
    
    window.firestore.onSnapshot(window.firestore.doc(db, "archives", "user_bailey"), (doc) => {
        if(doc.exists()) {
            window.mediaList = doc.data().list || [];
            document.getElementById('syncStatus').innerText = "CLOUD SYNCED";
            render();
        }
    });
</script>

<script>
    window.mediaList = [];
    let tmdbKey = localStorage.getItem('tmdbKey') || '';
    let currentFilter = 'all';
    let isSearch = false;

    async function save() {
        await window.firestore.setDoc(window.firestore.doc(window.vaultDB, "archives", "user_bailey"), { list: window.mediaList });
    }

    function render() {
        if(isSearch) return;
        const grid = document.getElementById('mainGrid');
        const filterStr = document.getElementById('filterInput').value.toLowerCase();
        grid.innerHTML = '';

        window.mediaList.forEach((item, idx) => {
            const passF = (currentFilter === 'all') || (currentFilter === item.status) || (currentFilter === 'animated' && (item.isAnimated || item.isAnime));
            if(item.name.toLowerCase().includes(filterStr) && passF) {
                const div = document.createElement('div');
                div.className = 'item-card';
                let progressUI = (item.type === 'tv' && item.totalEpisodes) ? `<div class="progress-container"><div class="progress-fill" style="width:${((item.checkedEpisodes?.length || 0) / item.totalEpisodes) * 100}%"></div></div>` : '';
                div.innerHTML = `
                    <div class="poster-container" onclick="openItem(${idx})"><img class="poster" src="${item.poster || ''}"></div>
                    <div class="info" onclick="openItem(${idx})"><strong>${item.name}</strong>${progressUI}</div>
                    <div class="controls">
                        <button class="btn-status ${item.status==='watching'?'active-watch':''}" onclick="setStatus(${idx},'watching')">Watch</button>
                        <button class="btn-status ${item.status==='pulse'?'active-pulse':''}" onclick="setStatus(${idx},'pulse')">Pulse</button>
                        <button class="btn-status ${item.status==='watched'?'active-done':''}" onclick="setStatus(${idx},'watched')">Done</button>
                    </div>
                `;
                grid.appendChild(div);
            }
        });
    }

    async function performFullSearch() {
        const q = document.getElementById('showInput').value;
        if(!q || !tmdbKey) return;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&query=${encodeURIComponent(q)}&include_adult=false`);
        const data = await res.json();
        const results = data.results.filter(i => i.media_type !== 'person');
        
        isSearch = true;
        document.getElementById('backBtn').style.display = 'block';
        document.getElementById('pageTitle').innerText = "DISCOVERING...";
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';

        results.forEach(item => {
            const already = window.mediaList.some(v => v.tmdbId === item.id);
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <img class="poster" src="https://image.tmdb.org/t/p/w500${item.poster_path}">
                <div class="title">${item.title || item.name}</div>
                <button class="btn-main" id="add-${item.id}" style="width:100%; font-size:11px;" onclick='addItem(${JSON.stringify(item).replace(/'/g, "")})'>
                    ${already ? 'IN VAULT' : 'ENGAGE'}
                </button>
            `;
            grid.appendChild(div);
        });
    }

    function addItem(item) {
        if(!window.mediaList.some(v => v.tmdbId === item.id)) {
            window.mediaList.unshift({
                name: item.title || item.name, status: 'watching', poster: `https://image.tmdb.org/t/p/w500${item.poster_path}`,
                type: item.media_type, tmdbId: item.id, isAnimated: item.genre_ids?.includes(16), checkedEpisodes: []
            });
            save();
            const btn = document.getElementById(`add-${item.id}`);
            if(btn) { btn.innerText = "SUCCESS"; btn.style.background = "#4caf50"; btn.style.color = "#fff"; }
        }
    }

    function setStatus(idx, s) { window.mediaList[idx].status = s; save(); }
    function exitSearch() { isSearch = false; document.getElementById('backBtn').style.display='none'; document.getElementById('pageTitle').innerText="THE VAULT"; document.getElementById('showInput').value=''; render(); }
    
    function setFilter(f, btn) {
        if(isSearch) exitSearch();
        currentFilter = f;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    async function openItem(idx) {
        const item = window.mediaList[idx];
        const modal = document.getElementById('modal');
        const body = document.getElementById('modalBody');
        modal.classList.add('active');
        body.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.5;">LOADING LOGS...</div>';
        
        try {
            const res = await fetch(`https://api.themoviedb.org/3/${item.type}/${item.tmdbId}?api_key=${tmdbKey}`);
            const data = await res.json();
            
            body.innerHTML = `
                <div class="modal-header">
                    <img src="${item.poster}" class="modal-poster">
                    <div class="modal-info">
                        <h3>${item.name}</h3>
                        <p>${data.overview || 'Mission summary unavailable.'}</p>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn-action btn-toon" onclick="toggleTag(${idx}, 'isAnimated')">${item.isAnimated?'UNTAG ANIMATED':'TAG AS ANIMATED'}</button>
                    <button class="btn-action btn-delete" onclick="deleteItem(${idx})">ERASE RECORD</button>
                </div>
                <div id="epArea"></div>
            `;
            if(item.type === 'tv') loadEpisodes(idx);
        } catch(e) { body.innerHTML = 'Encryption Error.'; }
    }

    async function loadEpisodes(idx) {
        const item = window.mediaList[idx];
        const res = await fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}?api_key=${tmdbKey}`);
        const data = await res.json();
        let html = `<select class="btn-main" style="width:100%; background:#000; color:#fff; height:50px; margin:20px 0 15px 0; border:1px solid var(--border);" onchange="fetchSeason(${idx}, this.value)">
            <option>SELECT MISSION PHASE (SEASON)</option>${data.seasons.map(s=>`<option value="${s.season_number}">${s.name}</option>`).join('')}</select>
            <div id="epList"></div>`;
        document.getElementById('epArea').innerHTML = html;
    }

    async function fetchSeason(idx, sNum) {
        const item = window.mediaList[idx];
        const res = await fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}/season/${sNum}?api_key=${tmdbKey}`);
        const data = await res.json();
        document.getElementById('epList').innerHTML = data.episodes.map(ep => `
            <div style="display:flex; gap:15px; margin-bottom:18px; border-bottom:1px solid #222; padding-bottom:12px; align-items: flex-start;">
                <input type="checkbox" style="width:28px; height:28px; accent-color:var(--glow);" ${item.checkedEpisodes?.includes(ep.id)?'checked':''} onchange="toggleEp(${idx},${ep.id})">
                <div style="font-size:13px;"><strong>${ep.episode_number}. ${ep.name}</strong><br><span style="opacity:0.5; line-height:1.4; font-size:11px;">${ep.overview || ''}</span></div>
            </div>
        `).join('');
    }

    function toggleEp(idx, id) {
        if(!window.mediaList[idx].checkedEpisodes) window.mediaList[idx].checkedEpisodes = [];
        const i = window.mediaList[idx].checkedEpisodes.indexOf(id);
        if(i > -1) window.mediaList[idx].checkedEpisodes.splice(i, 1);
        else { window.mediaList[idx].checkedEpisodes.push(id); if(window.mediaList[idx].status==='watching') window.mediaList[idx].status = 'pulse'; }
        save();
    }

    function toggleTag(idx, p) { window.mediaList[idx][p] = !window.mediaList[idx][p]; save(); openItem(idx); }
    function deleteItem(idx) { if(confirm("Confirm deletion?")) { window.mediaList.splice(idx, 1); save(); closeModal(); } }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }
    function openSettings() { const k = prompt("TMDB Key:", tmdbKey); if(k) { tmdbKey = k; localStorage.setItem('tmdbKey', k); location.reload(); } }
</script>
</body>
</html>
