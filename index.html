<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Vault</title>
    <style>
        :root {
            --glass: rgba(10, 15, 25, 0.97);
            --border: rgba(120, 169, 255, 0.3);
            --glow: #78a9ff;
            --accent: #ffcc00; 
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --glide: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed;
            font-family: -apple-system, system-ui, sans-serif;
            background: #050a15 url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2022&auto=format&fit=crop') center/cover fixed;
            color: #fff;
        }

        .app-container {
            height: 100%; display: flex; flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: calc(75px + var(--safe-bottom));
        }

        .scroll-view { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }

        .media-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; width: 100%;
        }

        .card { background: var(--glass); backdrop-filter: blur(35px); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 20px; }

        /* Swipe Container */
        .swipe-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            background: #000;
        }

        .swipe-bg {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; font-weight: 800; font-size: 10px; letter-spacing: 2px;
            opacity: 0; transition: opacity 0.2s;
        }

        .item-card {
            position: relative;
            background: rgba(255,255,255,0.03); border-radius: 20px;
            padding: 10px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 10px;
            z-index: 2; transition: transform 0.3s var(--glide);
            backdrop-filter: blur(10px);
        }
        
        .poster { width: 100%; aspect-ratio: 2/3; border-radius: 14px; object-fit: cover; background: #111; pointer-events: none; }
        .title { font-size: 0.85em; font-weight: 600; text-align: center; min-height: 2.4em; color: rgba(255,255,255,0.9); }

        .controls { display: flex; gap: 4px; width: 100%; }
        .btn-status { 
            flex: 1; font-size: 8px; padding: 10px 0; border-radius: 9px; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: rgba(255,255,255,0.4);
            text-transform: uppercase; font-weight: 800;
        }
        .active-watch { border-color: var(--accent) !important; color: var(--accent) !important; background: rgba(255,204,0,0.1) !important; }
        .active-pulse { border-color: var(--glow) !important; color: var(--glow) !important; background: rgba(120, 169, 255, 0.1) !important; }
        .active-done { border-color: #4caf50 !important; color: #4caf50 !important; background: rgba(76,175,80,0.1) !important; }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 9000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.8s var(--glide);
        }
        .modal.active { display: flex; opacity: 1; }
        .modal-content { 
            width: 92%; max-width: 450px; max-height: 82vh; background: #0a111f; 
            border: 1px solid var(--border); border-radius: 30px; padding: 30px; overflow-y: auto; 
            transform: scale(0.9) translate3d(0, 50px, 0); 
            transition: transform 1.0s var(--glide);
        }
        .modal.active .modal-content { transform: scale(1) translate3d(0, 0, 0); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(75px + var(--safe-bottom));
            background: rgba(0,0,0,0.95); backdrop-filter: blur(35px); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; padding-bottom: var(--safe-bottom); z-index: 5000;
        }
        .nav-item { background: none; border: none; color: rgba(255,255,255,0.3); display: flex; flex-direction: column; align-items: center; font-size: 10px; flex: 1; }
        .nav-item.active { color: var(--glow); }
        .nav-icon { width: 24px; height: 24px; background: currentColor; mask-size: contain; mask-repeat: no-repeat; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; margin-bottom: 5px; }

        .btn-main { background: var(--glow); color: #05162d; border: none; padding: 12px 20px; border-radius: 14px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
        .btn-rand { background: #ffcc00; color: #050a15; border: none; width: 100%; margin-top: 10px; padding: 14px; font-size: 13px; letter-spacing: 3px; border-radius: 14px; font-weight: 900; box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
        
        input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 14px; font-size: 16px !important; }

        #scrollTopBtn {
            position: fixed; bottom: calc(90px + var(--safe-bottom)); right: 20px;
            width: 58px; height: 58px; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(120, 169, 255, 0.4);
            z-index: 4000; opacity: 0; pointer-events: none; transition: all 0.5s var(--glide);
            transform: translateY(30px) scale(0.7); border-radius: 18px; display: flex; align-items: center; justify-content: center;
        }
        .arrow-shape { width: 32px; height: 32px; background-color: var(--glow); -webkit-mask: url('https://api.iconify.design/ph:caret-double-up-bold.svg') no-repeat center; mask-size: contain; }
        #scrollTopBtn.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        .intel-row { display: flex; gap: 10px; width: 100%; margin-bottom: 15px; }
        .btn-intel { flex: 1; font-size: 11px; padding: 12px; border-radius: 12px; font-weight: bold; text-decoration: none; text-align: center; border: 1px solid var(--border); color: #fff; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="scroll-view" id="mainScroll">
        <div class="card">
            <h2 id="pageTitle" style="margin: 0 0 15px 0; font-size: 1.4em; letter-spacing: 4px; font-weight: 300; text-align: center;">THE VAULT</h2>
            <div class="search-row" style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="showInput" placeholder="Initialize Entry..." onkeydown="if(event.key==='Enter') performFullSearch()">
                <button class="btn-main" onclick="performFullSearch()">ENGAGE</button>
            </div>
            <input type="text" id="filterInput" style="width:100%; height:42px; background:rgba(0,0,0,0.3);" placeholder="Search Archive..." onkeyup="render()">
            <button class="btn-rand" onclick="randomize()">RANDOMIZE MISSION</button>
        </div>
        <button id="backBtn" class="btn-main" style="display:none; width:100%; margin-bottom:20px; padding:18px;" onclick="exitSearch()">← RETURN TO ARCHIVE</button>
        <div class="media-grid" id="mainGrid"></div>
    </div>
</div>

<div id="scrollTopBtn" onclick="scrollToTop()"><div class="arrow-shape"></div></div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="setFilter('all', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:stack-bold.svg')"></div>All</button>
    <button class="nav-item" onclick="setFilter('watching', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:clock-bold.svg')"></div>Watch</button>
    <button class="nav-item" onclick="setFilter('pulse', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:activity-bold.svg')"></div>Pulse</button>
    <button class="nav-item" onclick="openSystemPanel()"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:gear-bold.svg')"></div>Settings</button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalBody"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const config = {
        apiKey: "AIzaSyAf9NqhQ8iGoVWeCCCoZChF1RKY-HER678",
        authDomain: "the-vault-41656.firebaseapp.com",
        projectId: "the-vault-41656",
        storageBucket: "the-vault-41656.firebasestorage.app",
        messagingSenderId: "8990033543",
        appId: "1:8990033543:web:1579e3987a69f9ffcd1a22"
    };

    const app = initializeApp(config);
    const db = getFirestore(app);
    window.db = db; window.fLib = { doc, setDoc, onSnapshot };
    
    const cache = localStorage.getItem('v_cache');
    if(cache) { window.mediaList = JSON.parse(cache); render(); }

    window.fLib.onSnapshot(window.fLib.doc(db, "archives", "user_bailey"), (doc) => {
        if(doc.exists()) {
            window.mediaList = doc.data().list || [];
            localStorage.setItem('v_cache', JSON.stringify(window.mediaList));
            render();
        }
    });
</script>

<script>
    window.mediaList = [];
    let tmdbKey = localStorage.getItem('tmdbKey') || '';
    let currentFilter = 'all';
    let isSearch = false;

    const scrollArea = document.getElementById('mainScroll');
    const scrollBtn = document.getElementById('scrollTopBtn');
    scrollArea.onscroll = () => {
        if (scrollArea.scrollTop > 200) scrollBtn.classList.add('visible');
        else scrollBtn.classList.remove('visible');
    };

    function scrollToTop() { scrollArea.scrollTo({ top: 0, behavior: 'smooth' }); }

    async function save() {
        localStorage.setItem('v_cache', JSON.stringify(window.mediaList));
        await window.fLib.setDoc(window.fLib.doc(window.db, "archives", "user_bailey"), { list: window.mediaList });
    }

    function render() {
        if(isSearch) return;
        const grid = document.getElementById('mainGrid');
        const filterStr = document.getElementById('filterInput').value.toLowerCase();
        grid.innerHTML = '';
        window.mediaList.forEach((item, idx) => {
            if((currentFilter === 'all' || item.status === currentFilter) && item.name.toLowerCase().includes(filterStr)) {
                const container = document.createElement('div');
                container.className = 'swipe-container';
                container.innerHTML = `
                    <div class="swipe-bg" id="bg-${idx}">
                        <span style="color:#ff4444">DELETE</span>
                        <span style="color:var(--accent)">STATUS</span>
                    </div>
                    <div class="item-card" id="card-${idx}" 
                         ontouchstart="handleTouchStart(event, ${idx})" 
                         ontouchmove="handleTouchMove(event, ${idx})" 
                         ontouchend="handleTouchEnd(event, ${idx})"
                         onclick="openItem(${idx})">
                        <img class="poster" src="${item.poster}">
                        <div class="title">${item.name}</div>
                        <div class="controls">
                            <div class="btn-status ${item.status==='watching'?'active-watch':''}">Watch</div>
                            <div class="btn-status ${item.status==='pulse'?'active-pulse':''}">Pulse</div>
                            <div class="btn-status ${item.status==='watched'?'active-done':''}">Done</div>
                        </div>
                    </div>`;
                grid.appendChild(container);
            }
        });
    }

    // Swipe Logic
    let startX = 0;
    let currentX = 0;

    window.handleTouchStart = (e, idx) => {
        startX = e.touches[0].clientX;
        const card = document.getElementById(`card-${idx}`);
        card.style.transition = 'none';
        document.getElementById(`bg-${idx}`).style.opacity = '1';
    };

    window.handleTouchMove = (e, idx) => {
        currentX = e.touches[0].clientX - startX;
        const card = document.getElementById(`card-${idx}`);
        const bg = document.getElementById(`bg-${idx}`);
        
        // Resistance
        const transformX = currentX * 0.8;
        card.style.transform = `translateX(${transformX}px)`;
        
        if (transformX > 50) bg.style.background = 'rgba(255, 204, 0, 0.15)';
        else if (transformX < -50) bg.style.background = 'rgba(255, 68, 68, 0.15)';
        else bg.style.background = 'transparent';
    };

    window.handleTouchEnd = (e, idx) => {
        const card = document.getElementById(`card-${idx}`);
        card.style.transition = 'transform 0.4s var(--glide)';
        
        if (currentX > 120) {
            const cycle = { 'watching': 'pulse', 'pulse': 'watched', 'watched': 'watching' };
            window.mediaList[idx].status = cycle[window.mediaList[idx].status];
            save(); render();
        } else if (currentX < -120) {
            if(confirm("Erase?")) { window.mediaList.splice(idx, 1); save(); render(); }
        }
        
        card.style.transform = 'translateX(0px)';
        document.getElementById(`bg-${idx}`).style.opacity = '0';
        currentX = 0;
    };

    function randomize() {
        const available = window.mediaList.filter(item => currentFilter === 'all' || item.status === currentFilter);
        if (available.length > 0) openItem(window.mediaList.indexOf(available[Math.floor(Math.random() * available.length)]));
    }

    async function openItem(idx) {
        const item = window.mediaList[idx];
        const modal = document.getElementById('modal');
        const body = document.getElementById('modalBody');
        modal.classList.add('active');
        body.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.5;">RETRIVING INTEL...</div>';
        
        try {
            const res = await fetch(`https://api.themoviedb.org/3/${item.type}/${item.tmdbId}?api_key=${tmdbKey}&append_to_response=videos,external_ids`);
            const data = await res.json();
            const trailer = data.videos?.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
            const imdbId = data.imdb_id || data.external_ids?.imdb_id;
            
            body.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; text-align:center;">
                    <img src="${item.poster}" style="width:140px; border-radius:18px; margin-bottom:20px;">
                    <h3 style="color:var(--glow); margin:0;">${item.name}</h3>
                    <p style="font-size:0.9em; line-height:1.6; opacity:0.7; margin:15px 0;">${data.overview}</p>
                    <div class="intel-row">
                        ${trailer ? `<a href="https://youtube.com/watch?v=${trailer.key}" target="_blank" class="btn-intel" style="border-color:#ff0000; color:#ff0000">TRAILER</a>` : ''}
                        <a href="https://www.imdb.com/title/${imdbId || 'find?q='+item.name}" target="_blank" class="btn-intel" style="border-color:#f5c518; color:#f5c518">IMDb</a>
                    </div>
                </div>`;
        } catch(e) { body.innerHTML = 'Intel restricted.'; }
    }

    async function performFullSearch() {
        const q = document.getElementById('showInput').value;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&query=${encodeURIComponent(q)}`);
        const data = await res.json();
        isSearch = true;
        document.getElementById('backBtn').style.display = 'block';
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.results.filter(i => i.poster_path).forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<img class="poster" src="https://image.tmdb.org/t/p/w500${item.poster_path}"><div class="title">${item.title || item.name}</div><button class="btn-main" style="width:100%;" onclick='addItem(${JSON.stringify(item).replace(/'/g, "")})'>ADD</button>`;
            grid.appendChild(div);
        });
    }

    window.addItem = (item) => {
        window.mediaList.unshift({ name: item.title || item.name, status: 'watching', poster: `https://image.tmdb.org/t/p/w500${item.poster_path}`, type: item.media_type, tmdbId: item.id });
        save(); exitSearch();
    };

    function exitSearch() { isSearch = false; document.getElementById('backBtn').style.display='none'; render(); }
    function setFilter(f, btn) { isSearch = false; currentFilter = f; document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }
    function openSystemPanel() { const k = prompt("TMDB Key:", tmdbKey); if(k) { tmdbKey = k; localStorage.setItem('tmdbKey', k); location.reload(); } }
</script>
</body>
</html>
