<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Vault</title>
    <style>
        :root {
            --glass: rgba(10, 15, 25, 0.9);
            --border: rgba(120, 169, 255, 0.3);
            --glow: #78a9ff;
            --accent: #ffcc00; 
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        /* Essential Reset to stop overlapping/bouncing */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; position: fixed;
            font-family: -apple-system, system-ui, sans-serif;
            background: #050a15 url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2022&auto=format&fit=crop') center/cover fixed;
            color: #fff;
        }

        /* Scrollable Area */
        .app-container {
            height: 100%; display: flex; flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: calc(70px + var(--safe-bottom)); /* Space for Nav */
        }

        .scroll-view {
            flex: 1; overflow-y: auto; padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        /* Layout Blocks */
        .card {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 15px; margin-bottom: 20px; width: 100%;
        }

        /* Header / Search */
        .search-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input { 
            flex: 1; background: #000; border: 1px solid var(--border); 
            color: #fff; padding: 12px; border-radius: 12px; font-size: 16px; 
        }
        .btn-main { 
            background: var(--glow); color: #000; border: none; 
            padding: 0 15px; border-radius: 12px; font-weight: bold; 
        }

        /* Grid - Fixed overlapping */
        .media-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; width: 100%;
        }
        .item-card {
            background: rgba(255,255,255,0.05); border-radius: 15px;
            padding: 8px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 8px;
        }
        .poster { width: 100%; aspect-ratio: 2/3; border-radius: 10px; object-fit: cover; background: #111; }
        .title { font-size: 0.85em; font-weight: 600; text-align: center; min-height: 2.4em; overflow: hidden; }

        /* Controls */
        .btn-group { display: flex; gap: 4px; }
        .btn-status { 
            flex: 1; font-size: 9px; padding: 6px 0; border-radius: 6px; 
            background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff;
            text-transform: uppercase; font-weight: bold;
        }
        .active-watch { border-color: var(--accent); color: var(--accent); background: rgba(255,204,0,0.1); }
        .active-pulse { border-color: var(--glow); color: var(--glow); background: rgba(120,169,255,0.1); }
        .active-done { border-color: #4caf50; color: #4caf50; background: rgba(76,175,80,0.1); }

        /* Bottom Nav - Better for Phone */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(65px + var(--safe-bottom));
            background: rgba(0,0,0,0.95); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: var(--safe-bottom); z-index: 5000;
        }
        .nav-item { 
            background: none; border: none; color: #888; 
            display: flex; flex-direction: column; align-items: center; font-size: 10px;
        }
        .nav-item.active { color: var(--glow); }
        .nav-icon { width: 22px; height: 22px; background: currentColor; mask-size: contain; mask-repeat: no-repeat; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; margin-bottom: 4px; }

        /* Modals */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 9000; display: none; flex-direction: column;
            padding: calc(20px + var(--safe-top)) 20px var(--safe-bottom) 20px;
        }
        .modal.active { display: flex; }
        .modal-content { overflow-y: auto; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }

        #syncStatus { position: fixed; top: var(--safe-top); left: 20px; font-size: 10px; color: var(--glow); z-index: 6000; }
    </style>
</head>
<body>

<div id="syncStatus">OFFLINE</div>

<div class="app-container">
    <div class="scroll-view">
        <div class="card">
            <h2 id="pageTitle" style="margin: 0 0 15px 0; font-size: 1.2em; letter-spacing: 2px;">THE VAULT</h2>
            <div class="search-row">
                <input type="text" id="showInput" placeholder="Add title...">
                <button class="btn-main" onclick="performFullSearch()">GO</button>
            </div>
            <input type="text" id="filterInput" style="width:100%; height:35px; font-size:14px;" placeholder="Filter current list..." onkeyup="render()">
        </div>

        <button id="backBtn" class="btn-main" style="display:none; width:100%; margin-bottom:15px; padding:10px;" onclick="exitSearch()">← BACK</button>
        <div class="media-grid" id="mainGrid"></div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="setFilter('all', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:house-bold.svg')"></div>Vault</button>
    <button class="nav-item" onclick="setFilter('watching', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:clock-bold.svg')"></div>Watch</button>
    <button class="nav-item" onclick="setFilter('pulse', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:activity-bold.svg')"></div>Pulse</button>
    <button class="nav-item" onclick="setFilter('animated', this)"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:rocket-launch-bold.svg')"></div>Toons</button>
    <button class="nav-item" onclick="openSettings()"><div class="nav-icon" style="-webkit-mask-image:url('https://api.iconify.design/ph:gear-bold.svg')"></div>Settings</button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-content" id="modalBody"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAf9NqhQ8iGoVWeCCCoZChF1RKY-HER678",
        authDomain: "the-vault-41656.firebaseapp.com",
        projectId: "the-vault-41656",
        storageBucket: "the-vault-41656.firebasestorage.app",
        messagingSenderId: "8990033543",
        appId: "1:8990033543:web:1579e3987a69f9ffcd1a22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.vaultDB = db;
    window.firestore = { doc, setDoc, onSnapshot };
    
    // Sync setup
    window.firestore.onSnapshot(window.firestore.doc(db, "archives", "user_bailey"), (doc) => {
        if(doc.exists()) {
            window.mediaList = doc.data().list || [];
            document.getElementById('syncStatus').innerText = "SYNCED";
            render();
        }
    });
</script>

<script>
    window.mediaList = [];
    let tmdbKey = localStorage.getItem('tmdbKey') || '';
    let currentFilter = 'all';
    let isSearch = false;

    async function save() {
        await window.firestore.setDoc(window.firestore.doc(window.vaultDB, "archives", "user_bailey"), { list: window.mediaList });
    }

    function render() {
        if(isSearch) return;
        const grid = document.getElementById('mainGrid');
        const filter = document.getElementById('filterInput').value.toLowerCase();
        grid.innerHTML = '';

        window.mediaList.forEach((item, idx) => {
            const passFilter = (currentFilter === 'all') || (currentFilter === item.status) || (currentFilter === 'animated' && (item.isAnimated || item.isAnime));
            if(item.name.toLowerCase().includes(filter) && passFilter) {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <img class="poster" src="${item.poster}" onclick="openItem(${idx})">
                    <div class="title">${item.name}</div>
                    <div class="btn-group">
                        <button class="btn-status ${item.status==='watching'?'active-watch':''}" onclick="setStatus(${idx},'watching')">W</button>
                        <button class="btn-status ${item.status==='pulse'?'active-pulse':''}" onclick="setStatus(${idx},'pulse')">P</button>
                        <button class="btn-status ${item.status==='watched'?'active-done':''}" onclick="setStatus(${idx},'watched')">D</button>
                    </div>
                `;
                grid.appendChild(div);
            }
        });
    }

    async function performFullSearch() {
        const q = document.getElementById('showInput').value;
        if(!q || !tmdbKey) return;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&query=${encodeURIComponent(q)}&include_adult=false`);
        const data = await res.json();
        const results = data.results.filter(i => i.media_type !== 'person');
        
        isSearch = true;
        document.getElementById('backBtn').style.display = 'block';
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';

        results.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <img class="poster" src="https://image.tmdb.org/t/p/w500${item.poster_path}">
                <div class="title">${item.title || item.name}</div>
                <button class="btn-main" style="width:100%; font-size:10px; padding:8px 0;" onclick='addItem(${JSON.stringify(item).replace(/'/g, "")})'>ADD</button>
            `;
            grid.appendChild(div);
        });
    }

    function addItem(item) {
        window.mediaList.unshift({
            name: item.title || item.name,
            status: 'watching',
            poster: `https://image.tmdb.org/t/p/w500${item.poster_path}`,
            type: item.media_type,
            tmdbId: item.id,
            isAnimated: item.genre_ids?.includes(16),
            checkedEpisodes: []
        });
        save();
        exitSearch();
    }

    function setStatus(idx, s) { window.mediaList[idx].status = s; save(); }
    function exitSearch() { isSearch = false; document.getElementById('backBtn').style.display='none'; document.getElementById('showInput').value=''; render(); }
    function setFilter(f, btn) {
        currentFilter = f;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function openItem(idx) {
        const item = window.mediaList[idx];
        const modal = document.getElementById('modal');
        const body = document.getElementById('modalBody');
        modal.classList.add('active');
        body.innerHTML = `
            <div style="text-align:center;">
                <img src="${item.poster}" style="width:120px; border-radius:10px; margin-bottom:15px;">
                <h3>${item.name}</h3>
                <button class="btn-main" style="background:#ff4444; color:#fff; width:100%; margin-bottom:20px;" onclick="deleteItem(${idx})">DELETE</button>
                <div id="epArea"></div>
            </div>
        `;
        if(item.type === 'tv') loadEpisodes(idx);
    }

    async function loadEpisodes(idx) {
        const item = window.mediaList[idx];
        const res = await fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}?api_key=${tmdbKey}`);
        const data = await res.json();
        let html = `<select class="btn-main" style="width:100%; background:#000; color:#fff;" onchange="fetchSeason(${idx}, this.value)">
            <option>Select Season</option>${data.seasons.map(s=>`<option value="${s.season_number}">${s.name}</option>`).join('')}</select>
            <div id="epList" style="margin-top:15px; text-align:left;"></div>`;
        document.getElementById('epArea').innerHTML = html;
    }

    async function fetchSeason(idx, sNum) {
        const item = window.mediaList[idx];
        const res = await fetch(`https://api.themoviedb.org/3/tv/${item.tmdbId}/season/${sNum}?api_key=${tmdbKey}`);
        const data = await res.json();
        document.getElementById('epList').innerHTML = data.episodes.map(ep => `
            <div style="display:flex; gap:10px; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px;">
                <input type="checkbox" style="width:20px; height:20px;" ${item.checkedEpisodes?.includes(ep.id)?'checked':''} onchange="toggleEp(${idx},${ep.id})">
                <span style="font-size:12px;">${ep.episode_number}. ${ep.name}</span>
            </div>
        `).join('');
    }

    function toggleEp(idx, id) {
        if(!window.mediaList[idx].checkedEpisodes) window.mediaList[idx].checkedEpisodes = [];
        const i = window.mediaList[idx].checkedEpisodes.indexOf(id);
        if(i > -1) window.mediaList[idx].checkedEpisodes.splice(i, 1);
        else { window.mediaList[idx].checkedEpisodes.push(id); window.mediaList[idx].status = 'pulse'; }
        save();
    }

    function deleteItem(idx) { window.mediaList.splice(idx, 1); save(); closeModal(); }
    function closeModal() { document.getElementById('modal').classList.remove('active'); }
    function openSettings() { const k = prompt("TMDB Key:", tmdbKey); if(k) { tmdbKey = k; localStorage.setItem('tmdbKey', k); location.reload(); } }
</script>
</body>
</html>
